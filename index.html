<!DOCTYPE html>
<html lang="vi">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  
  <title>Công cụ minh họa An Thịnh Phúc Niên</title>

  <link rel="icon" type="image/svg+xml" href="images/logo-small.png">

  <meta name="description" content="Công cụ minh họa An Thịnh Phúc Niên">
  <meta property="og:title" content="Công cụ minh họa An Thịnh Phúc Niên">
  <meta property="og:description" content="Công cụ minh họa bảo hiểm">
  <meta property="og:image" content="images/og_image.jpg">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:url" content="https://bvnt.me">
  <meta property="og:type" content="website">

  <style>
    :root {
      --navy: #102A43;
      --navy-2: #1C3A5E;
      --navy-3: #196BB4;
      --navy-4: #003b7a;
      --gold: #B8862B;
      --gold-2: #D7A94D;
      --gold-3: #dda307;
      --gold-4: #f6b508;
      --parchment: #FAF6EE;
      --paper: #FFFFFF;
      --ink: #1B2733;
      --slate: #5C6B7A;
      --line: #E4DCC8;
      --teal: #2F6F62;
      --terracotta: #B5562D;
      --radius: 10px;
      --shadow: 0 1px 2px rgba(16, 42, 67, .06), 0 4px 16px rgba(16, 42, 67, .06);
    }

    * {
      box-sizing: border-box;
    }

    /* select {
      -webkit-appearance: none;
      appearance: none;
    } */

    body {
      margin: 0;
      background: var(--parchment);
      color: var(--ink);
      font-family: "Segoe UI", -apple-system, BlinkMacSystemFont, Roboto, Arial, sans-serif;;
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
    }

    select {
      -webkit-appearance: none;
      -moz-appearance: none;
      appearance: none;
    }

    h1,
    h2,
    h3 {
      /* font-family: "Georgia", "Times New Roman", serif; */
      font-weight: 700;
      margin: 0;
      line-height: 1.15;
      font-size: 1.08rem;
    }

    /* GATE */
    #gate {
      position: fixed;
      inset: 0;
      /* background: var(--navy); */
      display: flex;
      align-items: center;
      justify-content: flex-start;
      z-index: 999;
      background: url('images/background_pc.jpg') center center / cover no-repeat;
    }

    .gate-box {
      background: rgba(255, 255, 255, 0.08);
      border-radius: 16px;
      padding: 72px 32px;
      max-width: 460px;
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.15);
      text-align: center;
      margin-left: 10%;
      box-shadow: 0 8px 32px rgba(100, 180, 230, 1);
    }

    @media (max-width: 768px) {
    #gate {
      background: url('images/background_sp3.jpg') center center / cover no-repeat;
      justify-content: center;
    }

    .gate-box {
      width: 85%;
      margin-left: 0;
      padding: 30px 32px;
    }
  }

    .gate-box h1 {
      font-size: 25px;
      color: white;
      margin-bottom: 6px;
    }

    .gate-box p {
      color: white;
      font-size: 16px;
      margin: 0 0 20px;
    }

    .gate-box input {
      width: 100%;
      padding: 12px 14px;
      border: 1px solid var(--line);
      border-radius: 8px;
      font-size: 16px;
      text-align: center;
      letter-spacing: 1px;
      margin-bottom: 12px;
    }

    .gate-box button {
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: 8px;
      background: var(--gold-3);
      color: #fff;
      font-weight: 600;
      font-size: 15px;
      cursor: pointer;
    }

    .gate-box button:hover {
      background: var(--gold-2);
    }

    .gate-error {
      display: none;
      color: var(--terracotta);
      font-size: 13px;
      margin-top: 8px;
    }

    /* HEADER */
    .app-header {
      background: var(--navy-3);
      color: #fff;
      padding: 14px 16px 12px;
    }

    .app-banner {
      max-width: 1040px;
      margin: auto;
      padding: 0;
    }

    @media screen and (min-width: 640px) {
      .app-banner {
        padding: 0 20px;
      }
    }

    .app-banner img {
      height: 100%;
      width: 100%;
      left: 0;
      top: 0;
      right: 0;
      bottom: 0;
      color: transparent;
      object-position: center;
      object-fit: cover;
      max-width: 100%;
      display: block;
    }

    .app-header .brand {
      display: flex;
      align-items: baseline;
      gap: 10px;
      max-width: 1040px;
      margin: 0 auto;
      flex-wrap: wrap;
    }

    .app-header .brand h1 {
      font-size: 19px;
      color: #fff;
    }

    .app-header .brand .tag {
      font-size: 12px;
      color: var(--gold-4);
      letter-spacing: .04em;
      font-weight: 800;
    }

    /* STEPS */
    #steps {
      display: flex;
      align-items: center;
      max-width: 1040px;
      margin: 20px auto 0;
      padding: 0 20px;
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
      scrollbar-width: none;
      justify-content: center;
    }

    #steps::-webkit-scrollbar {
      display: none;
    }

    .step {
      display: flex;
      align-items: center;
      gap: 8px;
      cursor: pointer;
      opacity: .25;
      flex-shrink: 0;

      justify-content: center;
    }

    .step.active,
    .step.done {
      opacity: 1;
    }

    .step-num {
      width: 22px;
      height: 22px;
      min-width: 22px;
      border-radius: 50%;
      background: rgba(255, 255, 255, .15);
      /* color: #fff; */
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 15px;
      font-weight: 600;
      color: var(--navy-4);
      border: solid 1px var(--navy-4);
      /* border-color: var(--navy-4); */
    }

    .step.active > .step-num {
      border: none;
      color: #fff;
    }

    .step.active .step-num {
      background: var(--gold-3);
    }

    .step.done .step-num {
      background: var(--teal);
      border: none;
      background-color: var(--navy-4);
      color: #fff;
    }

    .step-label {
      font-size: 15px;
      /* color: #fff; */
      white-space: nowrap;
      font-weight: 700;

      color: var(--navy-4);
    }

    .step-divider {
      flex: 0 0 28px;
      height: 1px;
      /* background: rgba(255, 255, 255, .2); */
      margin: 0 10px;
      background-color: var(--navy-4);
      opacity: .15;
    }

    @media (max-width:540px) {
      .app-header {
        padding: 12px 14px 10px;
      }

      .app-header .brand h1 {
        font-size: 16px;
      }

      .app-header .brand .tag {
        font-size: 10px;
      }

      #steps {
        padding: 0 14px;
        justify-content: center;
        
      }

      .step-divider {
        flex: 0 0 16px;
        margin: 0 6px;
      }

      .step:not(.active) .step-label {
        display: none;
      }

      .step.active .step-label {
        font-size: 14px;
        font-weight: 600;
      }
    }

    /* LAYOUT */
    #page-root {
      max-width: 1040px;
      margin: 20px auto 80px;
      padding: 0 20px;
    }

    .card {
      background: var(--paper);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      padding: 22px 24px;
      margin-bottom: 18px;
      box-shadow: var(--shadow);
    }

    .card-title {
      font-size: 18px;
      color: var(--navy-4);
      margin-bottom: 16px;
      border-bottom: 2px solid var(--gold);
      padding-bottom: 10px;
    }

    .sub-title {
      font-size: 15px;
      color: var(--navy);
      margin: 18px 0 10px;
    }

    .grid2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px 20px;
    }

    @media (max-width:640px) {
      .grid2 {
        grid-template-columns: 1fr;
      }
    }

    .field label {
      display: inline-flex;
      align-items: center;
      font-size: 16px;
      color: var(--navy-4);
      margin-bottom: 6px;
      font-weight: 700;
    }

    .field input,
    .field select {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid var(--line);
      border-radius: 8px;
      font-size: 16px;
      background: #fff;
      font-variant-numeric: tabular-nums;
    }

    .field input:focus,
    .field select:focus {
      outline: 2px solid var(--gold-2);
      border-color: var(--gold);
    }

    .rider-info-icon {
      cursor: pointer;
      width: 18px;
      height: 18px;
      vertical-align: middle;
      display: inline;
      margin-left: 3px;
    }

    .hint {
      font-size: 12px;
      color: var(--slate);
      margin-top: 5px;
    }

    .hint-pending {
      color: #A65D2E;
      font-weight: 600;
    }

    .inline-row {
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }

    .inline-row .input-with-icon input {
      padding-left: 40px;
    }

    .field .input-with-icon input {
      padding-left: 40px;
    }

    .field .input-with-icon {
      position: relative;
      flex: 1;
    }

    .rider-input-row .input-with-icon {
      position: relative;
      flex: 1;
    }

    .rider-input-row .input-with-icon input {
      padding-left: 40px;
    }

    .input-with-icon .input-icon {
      position: absolute;
      left: 12px;
      top: 50%;
      transform: translateY(-50%);
      width: 18px;
      height: 18px;
      pointer-events: none;
    }

    .inline-row label {
      margin-bottom: 0;
      flex: 0 0 auto;
      white-space: nowrap;
    }

    .inline-row input {
      flex: 1;
      min-width: 140px;
    }

    .inline-row select {
      flex: 1;
      width: auto;
      min-width: 120px;
    }

    .field .inline-row .select-with-icon {
      position: relative;
      flex: 1;
    }

    .rider-input-row .select-with-icon {
      position: relative;
      flex: 1;
    }

    .field .inline-row .select-with-icon select {
      padding-left: 40px;
    }

    .rider-input-row .select-with-icon select {
      padding-left: 40px;
    }

    .select-with-icon .select-icon {
      position: absolute;
      left: 12px;
      top: 50%;
      transform: translateY(-50%);

      width: 18px;
      height: 18px;

      pointer-events: none;
      z-index: 1;
    }

    .inline-row .seg {
      flex: 1;
      min-width: 160px;
    }

    .dual-inline-row {
      display: flex;
      gap: 14px;
      flex-wrap: wrap;
    }

    .dual-inline-row .inline-row {
      flex: 1;
      min-width: 150px;
    }

    .dual-inline-row .inline-row select {
      width: auto;
      min-width: 60px;
      padding: 10px 10px;
      flex: 0 1 auto;
    }

    .dob-row {
      display: flex;
      gap: 8px;
    }

    .dob-row select {
      flex: 1;
      padding: 10px 8px;
      border: 1px solid var(--line);
      border-radius: 8px;
      font-size: 16px;
      background: #fff;
    }

    .seg {
      display: flex;
      border: 1px solid var(--line);
      border-radius: 8px;
      overflow: hidden;
    }

    .seg-btn {
      flex: 1;
      padding: 10px;
      border: none;
      background: #fff;
      cursor: pointer;
      font-size: 14px;
      color: var(--ink);
      align-items: center;
      justify-content: center;
      display: flex;
    }

    .seg-btn.active {
      background: var(--navy);
      color: #fff;
    }

    .seg-btn .gender-icon {
      width: 18px;
      height: 18px;
      flex-shrink: 0;
      margin-right: 8px;
    }

    .seg-btn.active .gender-icon {
      filter: brightness(0) invert(1);
    }

    /* RIDERS */
    .riders-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .rider-row {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 10px 0;
      border-bottom: 1px solid var(--line);
      flex-wrap: wrap;
    }

    .rider-check {
      display: flex;
      align-items: center;
      gap: 10px;
      flex: 1;
      min-width: 220px;
      cursor: pointer;
      font-size: 14px;
    }

    .rider-check-label {
      color: var(--navy-4);
      font-weight: 700;
      display: block;
    }

    .rider-check input {
      width: 18px;
      height: 18px;
      border: 1px solid var(--navy-4);
      accent-color: var(--gold);
    }

    .rider-input {
      width: 220px;
      max-width: 100%;
      padding: 9px 11px;
      border: 1px solid var(--line);
      border-radius: 8px;
      font-size: 16px;
    }

    .rider-input:disabled {
      background: #F4F1E8;
      color: #aaa;
    }

    .rider-input-col {
      display: flex;
      flex-direction: column;
      gap: 3px;
    }

    .rider-input-col .hint {
      margin-top: 0;
    }

    .rider-input-row {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    .total-first-year {
      width: 100%;
      /* padding: 10px 12px; */
      border: none;
      border-radius: 8px;
      font-size: 20px;
      background: #fff;
      font-variant-numeric: tabular-nums;
      font-weight: 700;
      color: var(--gold);
    }

    .rider-fee {
      font-size: 12.5px;
      color: var(--teal);
      font-weight: 600;
      white-space: nowrap;
    }

    /* ACTIONS */
    .actions {
      display: flex;
      gap: 12px;
      justify-content: flex-end;
      flex-wrap: wrap;
    }

    .btn {
      padding: 12px 22px;
      border-radius: 30px;
      border: 1px solid transparent;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      touch-action: manipulation;
      line-height: 1;
    }

    .btn-primary {
      background: var(--gold-3);
      color: #fff;
    }

    .btn-primary:hover {
      background: var(--gold-4);
      border-color: var(--gold-3);
    }

    .btn-secondary {
      background: #fff;
      border: 1px solid var(--line);
      color: var(--navy);
    }

    .btn-secondary:hover {
      background: #F4F1E8;
    }

    .btn-danger-armed {
      background: var(--terracotta) !important;
      color: #fff !important;
      border-color: var(--terracotta) !important;
    }

    .error-banner {
      background: #FDECE7;
      border: 1px solid var(--terracotta);
      color: #8a3a1f;
      padding: 12px 14px;
      border-radius: 8px;
      font-size: 13.5px;
      margin-bottom: 16px;
      line-height: 1.6;
    }

    .input-error {
      border-color: var(--terracotta) !important;
      outline: 1px solid #f5c4b4 !important;
      background: #fff8f6 !important;
    }

    /* PAGE 2 */
    .summary-head {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 16px;
      flex-wrap: wrap;
      margin-bottom: 16px;
    }

    .rate-toggle {
      display: flex;
      gap: 6px;
      flex-wrap: nowrap;
    }

    .rate-btn {
      padding: 7px 10px;
      border: 1px solid var(--line);
      background: #fff;
      border-radius: 20px;
      font-size: 15px;
      cursor: pointer;
      color: var(--slate);
      white-space: nowrap;
      flex: 1;
    }

    .rate-btn.active {
      background: var(--navy);
      color: #fff;
      border-color: var(--navy);
    }

    .view-toggle {
      display: flex;
      gap: 8px;
      margin-bottom: 14px;
    }

    .view-btn {
      padding: 7px 14px;
      border: 1px solid var(--line);
      background: #fff;
      border-radius: 8px;
      font-size: 15px;
      cursor: pointer;
      color: var(--slate);
      font-weight: 600;
    }

    .view-btn.active {
      background: var(--gold);
      color: #fff;
      border-color: var(--gold);
    }

    .illus-cards {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .illus-card {
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 14px 16px;
      background: #FBF9F2;
    }

    .illus-card.milestone-row {
      background: #F3DFAE;
      border-color: #D9B65C;
    }

    .illus-card-head {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      margin-bottom: 8px;
      padding-bottom: 8px;
      border-bottom: 1px solid rgba(16, 42, 67, .12);
    }

    .illus-card-year {
      font-weight: 700;
      color: var(--navy);
      font-size: 15px;
    }

    .illus-card-age {
      font-size: 12.5px;
      color: var(--slate);
    }

    .illus-card-row {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      padding: 4px 0;
      font-size: 13px;
    }

    .illus-card-label {
      color: var(--slate);
    }

    .illus-card-val {
      font-weight: 600;
      color: var(--ink);
      font-variant-numeric: tabular-nums;
      text-align: right;
      white-space: nowrap;
    }

    .illus-card-val.strong {
      color: var(--navy);
      font-weight: 700;
    }

    .illus-card-val.pos {
      color: var(--teal);
    }

    .illus-card-val.neg {
      color: var(--terracotta);
    }

    .kpi-row {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 14px;
      margin-bottom: 18px;
    }

    @media (max-width:640px) {
      .kpi-row {
        grid-template-columns: 1fr;
      }
    }

    .kpi {
      background: var(--parchment);
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 14px 16px;
    }

    .kpi-label {
      font-size: 12px;
      color: var(--slate);
      margin-bottom: 4px;
    }

    .kpi-val {
      font-size: 20px;
      font-weight: 700;
      color: var(--navy);
      font-variant-numeric: tabular-nums;
    }

    .kpi-val.pos {
      color: var(--teal);
    }

    .kpi-val.neg {
      color: var(--terracotta);
    }

    .table-wrap {
      overflow-x: auto;
      border: 1px solid var(--line);
      border-radius: 8px;
      max-height: 70vh;
    }

    .illus-table {
      border-collapse: collapse;
      width: 100%;
      font-size: 13px;
      white-space: normal;
      table-layout: fixed;
    }

    .illus-table th,
    .illus-table td {
      padding: 7px 6px;
      text-align: center;
      border-bottom: 1px solid var(--line);
      font-variant-numeric: tabular-nums;
      word-break: break-word;
      line-height: 1.3;
      font-size: 12px;
    }

    .illus-table thead th {
      background: var(--navy);
      color: #fff;
      text-align: center;
      font-weight: 600;
      position: sticky;
      top: 0;
      z-index: 2;
      white-space: normal;
    }

    .illus-table td.sticky {
      position: sticky;
      left: 0;
      z-index: 1;
      background: #fff;
      color: var(--ink);
      font-weight: 600;
      text-align: center;
      width: 78px;
    }

    .illus-table thead th.sticky {
      position: sticky;
      top: 0;
      left: 0;
      z-index: 3;
      background: var(--navy);
      color: #fff;
      text-align: center;
    }

    .illus-table tbody tr:nth-child(odd) {
      background: #FBF9F2;
    }

    .illus-table tbody tr:nth-child(odd) td.sticky {
      background: #FBF9F2;
    }

    .illus-table tbody tr.milestone-row {
      background: #F3DFAE;
    }

    .illus-table tbody tr.milestone-row td.sticky {
      background: #E8C77E;
      color: var(--navy);
    }

    .illus-table tbody tr.milestone-row td {
      font-weight: 600;
    }

    .pos {
      color: var(--teal);
      font-weight: 600;
    }

    .neg {
      color: var(--terracotta);
      font-weight: 600;
    }

    /* PAGE 3 */
    /* PAGE 3 — BANG QUYEN LOI */
    .benefit-section {
      margin-bottom: 22px;
    }

    .benefit-section-title {
      font-size: 15px;
      font-weight: 700;
      color: var(--navy-4);
      background: var(--parchment);
      border-left: 4px solid var(--gold);
      padding: 8px 12px;
      margin-bottom: 0;
    }

    .benefit-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 14.5px;
    }

    .benefit-table .label-bold{
      font-weight: 700;
    }

    .benefit-table td {
      padding: 9px 12px;
      border-bottom: 1px solid var(--line);
      vertical-align: top;
    }

    .benefit-table td:first-child {
      width: 62%;
      color: var(--ink);
    }

    .benefit-table td:last-child {
      text-align: right;
      font-weight: 700;
      color: var(--navy);
      white-space: nowrap;
      font-variant-numeric: tabular-nums;
    }

    .benefit-table tr:nth-child(odd) {
      background: #FBF9F2;
    }

    .benefit-table .note {
      font-size: 11.5px;
      color: var(--slate);
      font-weight: 400;
      display: block;
      margin-top: 2px;
    }

          }
        }
        L = L * (1 + annualRate) + newDuyTri;
        N = N * (1 + annualRate) + newHoanPhi;

        const GTTKCoBan = Math.max(Jprev, 0);
        const GTTKDongThem = L + M + N;
        const GTTKHD = GTTKCoBan + GTTKDongThem;
        const QLBHTuVong = Math.max(GTTKCoBan, inputs.stbhChinh) + GTTKDongThem;
        const phiChamDut = terminationFeeRate(n) * inputs.phiCoBan;
        const giaTriHoanLai = Math.max(GTTKHD - phiChamDut, 0);

        let riderPremiumYear = 0;
        for (const r of inputs.riders) riderPremiumYear += riderPremiumForAge(r, age, inputs.gender, inputs.nhomNgheNghiep);
        cumSPBK += riderPremiumYear;
        const premiumThisYear = paying ? (inputs.phiCoBan + inputs.phiDongThem) : 0;
        cumSPC += premiumThisYear;

        yearly.push({
          year: n, age, premiumThisYear, cumSPC,
          QLBHTuVong, thuongCombined: L + N,
          newBonusThisYear: newDuyTri + newHoanPhi,
          bonusMilestoneEligible: (n % 5 === 0 && eligible),
          GTTKCoBan, GTTKDongThem, GTTKHD, giaTriHoanLai,
          riderPremiumYear, cumSPBK,
          tongLuyKe: cumSPC + cumSPBK,
          chenhLech: GTTKHD - (cumSPC + cumSPBK)
        });
      }
      return yearly;
    }

    // ============ STBH LIMIT RULES (theo sheet 1.NĐBH cột H,I và PhiSPC cột O,P,Q) ============
    const MAXSTBH = {
      nam: [100, 100, 100, 100, 100, 100, 100, 100, 100, 95, 95, 95, 90, 90, 90, 85, 85, 85, 80, 80, 80, 80, 75, 75, 75, 75, 70, 70, 70, 65, 65, 65, 65, 60, 60, 60, 55, 55, 55, 55, 50, 50, 50, 45, 45, 45, 45, 40, 40, 40, 40, 35, 35, 35, 30, 30, 30, 30, 25, 25, 25, 25, 25, 20, 20, 20],

    };
    function maxStbhMultiplier(age, gender) {
      const arr = gender === 'Nam' ? MAXSTBH.nam : MAXSTBH.nu;
      const idx = Math.min(Math.max(age, 0), arr.length - 1);
      return arr[idx];
    }
    function stbhChinhLimits(phiCoBan, age, gender) {
      if (!phiCoBan || age === null) return null;
      const min = Math.max(50000000, 5 * phiCoBan);
      const max = maxStbhMultiplier(age, gender) * phiCoBan;
      return { min, max };
    }
    function phiDongThemMaxLimit(phiCoBan) {
      if (!phiCoBan) return null;
      return { min: 1000000, max: 5 * phiCoBan };
    }
    function riderStbhLimits(riderType, age, phiCoBan, stbhChinh) {
      if (riderType === 'R21' || riderType === 'R22' || riderType === 'R23' || riderType === 'R25') {
        if (!stbhChinh) return null;
        return { min: 100000000, max: stbhChinh };
      }
      if (riderType === 'R29') {
        if (!phiCoBan || age === null) return null;
        let tierMax;
        if (phiCoBan >= 100000000) tierMax = 2000000;
        else if (phiCoBan >= 50000000) tierMax = 1000000;
        else if (phiCoBan >= 30000000) tierMax = 500000;
        else if (phiCoBan >= 10000000) tierMax = 300000;
        else return { notAllowed: true };
        const ageCap = age >= 18 ? 2000000 : 300000;
        const min = phiCoBan >= 10000000 ? 100000 : null;
        if (min === null) return { notAllowed: true };
        return { min, max: Math.min(tierMax, ageCap) };
      }
      return null;
    }
    const R26_TIER_ORDER = ['KHÔNG', 'Bạc', 'Vàng', 'Bạch Kim', 'Kim Cương', 'Lục Bảo'];
    function r26TierRange(phiCoBan) {
      if (!phiCoBan) return null;
      function tierFor(threshold) {
        if (phiCoBan >= 50000000) return 'Lục Bảo';
        if (phiCoBan >= 30000000) return 'Kim Cương';
        if (phiCoBan >= 20000000) return 'Bạch Kim';
        if (phiCoBan >= 10000000) return 'Vàng';
        if (phiCoBan >= 5000000) return 'Bạc';
        return 'KHÔNG';
      }
      const minTier = phiCoBan >= 5000000 ? 'Bạc' : 'KHÔNG';
      const maxTier = tierFor();
      return { minTier, maxTier };
    }

    function daysInMonth(month, year) {
      if (!month) return 31;
      const y = year || 2000;

    function parseNum(str) {

    function attachThousandFormatter(input) {
      input.addEventListener('input', (e) => {
        const cursorFromEnd = input.value.length - input.selectionStart;
        let raw = input.value.replace(/[^\d]/g, '');
        input.value = raw ? Number(raw).toLocaleString('vi-VN') : '';
        const pos = Math.max(input.value.length - cursorFromEnd, 0);
        input.setSelectionRange(pos, pos);
      });
    }
    function calcAge(day, month, year, today) {
      if (!day || !month || !year) return null;
      const dob = new Date(Number(year), Number(month) - 1, Number(day));
      let age = today.getFullYear() - dob.getFullYear();
      const hadBday = (today.getMonth() > dob.getMonth()) || (today.getMonth() === dob.getMonth() && today.getDate() >= dob.getDate());
      if (!hadBday) age--;
      return age;
    }

        if (hintEl) {
          hintEl.innerHTML = state.customer.age !== null
            ? `Tuổi được bảo hiểm: <b>${state.customer.age}</b> (ngày tham gia: ${new Date().toLocaleDateString('vi-VN')})`
            : (formatted.length === 10 ? '⚠️ Ngày sinh không hợp lệ.' : 'Nhập đầy đủ ngày/tháng/năm sinh theo định dạng dd/mm/yyyy để tính tuổi.');
        }
        refreshHints();
      });

      document.querySelectorAll('.seg-btn').forEach(b => {
        b.addEventListener('click', () => { state.customer.gender = b.dataset.g; renderPage1(); });
      });
      document.getElementById('f-nhom').addEventListener('change', e => {
        state.customer.nhomNgheNghiep = Number(e.target.value);
        refreshHints();
      });
      ['f-stbh', 'f-phicoban', 'f-phidongthem'].forEach(id => {
        const el = document.getElementById(id);
        attachThousandFormatter(el);
        el.addEventListener('input', () => {
          if (id === 'f-stbh') state.product.stbhChinh = el.value;
          if (id === 'f-phicoban') state.product.phiCoBan = el.value;
          if (id === 'f-phidongthem') state.product.phiDongThem = el.value;
          refreshHints();
        });
      });
      document.getElementById('f-term').addEventListener('change', e => { state.product.termMode = e.target.value; renderPage1(); });
      document.getElementById('f-payyears').addEventListener('input', e => state.product.paymentYears = Number(e.target.value));

      document.querySelectorAll('.rider-toggle').forEach(cb => {
        cb.addEventListener('change', () => {
          state.riders[cb.dataset.rider].enabled = cb.checked;
          renderPage1();
        });
      });
      document.querySelectorAll('[data-rider-stbh]').forEach(inp => {
        attachThousandFormatter(inp);
        inp.addEventListener('input', () => { state.riders[inp.dataset.riderStbh].stbh = inp.value; refreshHints(); });
      });
      document.querySelectorAll('[data-rider-tier]').forEach(sel => {
        sel.addEventListener('change', () => { state.riders[sel.dataset.riderTier].tier = sel.value; refreshHints(); });
      });

      document.getElementById('btn-go-page2').addEventListener('click', () => {
        if (!validatePage1()) return;
        computeResults();
        state.page = 2;
        renderAll();
      });

      // Xóa border đỏ khi focus vào input
      ['f-dob', 'f-stbh', 'f-phicoban', 'f-payyears'].forEach(id => {
        const el = document.getElementById(id);
        if (el) el.addEventListener('input', () => el.classList.remove('input-error'));
      });

      updateTotalFirstYear();
    }

    function refreshHints() {
      const age = state.customer.age;
      const phiCoBan = parseNum(state.product.phiCoBan);
      const stbhChinh = parseNum(state.product.stbhChinh);
      const gender = state.customer.gender;

      const stbhHintEl = document.getElementById('hint-stbh-chinh');
      if (stbhHintEl) stbhHintEl.innerHTML = stbhHintHtml(stbhChinhLimits(phiCoBan, age, gender));

      const savingEl = document.getElementById('hint-daily-saving');
      if (savingEl) savingEl.innerHTML = phiCoBan ? `Tiết kiệm: <b>${fmtMoney(Math.round(phiCoBan / 365))} đồng/ngày</b>` : '';

      const pdtHintEl = document.getElementById('hint-phidongthem');
      if (pdtHintEl) {
        const limPDT = phiDongThemMaxLimit(phiCoBan);
        pdtHintEl.innerHTML = limPDT ? `Tối đa: <b>${fmtMoney(limPDT.max)} đ</b>/năm (5 lần phí cơ bản).` : '';
      }

      RIDER_DEFS.forEach(r => {
        const st = state.riders[r.type];
        if (r.type === 'R26') {
          const el = document.getElementById('hint-rider-R26');
          if (el) {
            const tr = r26TierRange(phiCoBan);
            el.innerHTML = tr ? `Hạng mức cho phép theo phí cơ bản: <b>${tr.minTier}</b> – <b>${tr.maxTier}</b>.` : 'Nhập Phí bảo hiểm cơ bản để xem hạng mức cho phép.';
          }
          const feeEl = document.getElementById('fee-rider-R26');
          if (feeEl) feeEl.innerHTML = riderFeeHtml(r, st);
          return;
        }
        const el = document.getElementById('hint-rider-' + r.type);
        if (el) {
          const lim = riderStbhLimits(r.type, age, phiCoBan, stbhChinh);
          el.innerHTML = riderHintHtml(r.type, lim);
        }
        const feeEl = document.getElementById('fee-rider-' + r.type);
        if (feeEl) feeEl.innerHTML = riderFeeHtml(r, st);
      });

      updateTotalFirstYear();
    }

    function updateTotalFirstYear() {
      const el = document.getElementById('f-total-first-year');
      if (!el) return;
      const phiCoBan = parseNum(state.product.phiCoBan) || 0;
      const riderTypes = ['R21', 'R22', 'R23', 'R25', 'R26', 'R29'];
      let riderTotal = 0;
      riderTypes.forEach(type => {
        const r = state.riders[type];
        if (!r || !r.enabled) return;
        const riderInput = type === 'R26' ? { type, tier: r.tier } : { type, stbh: parseNum(r.stbh) };
        riderTotal += riderPremiumForAge(riderInput, state.customer.age, state.customer.gender, state.customer.nhomNgheNghiep);
      });

      const total = phiCoBan + riderTotal;
      el.textContent = total > 0 ? '₫ ' + fmtMoney(total) : '';
    }

    function validatePage1() {
      const errs = [];
      const term = resolvedTerm();
      const fieldErrors = { dob: false, stbh: false, phicoban: false, payyears: false };

      if (state.customer.age === null) { errs.push('Vui lòng chọn đầy đủ ngày sinh.'); fieldErrors.dob = true; }

      if (!parseNum(state.product.stbhChinh)) { errs.push('Vui lòng nhập Số tiền bảo hiểm.'); fieldErrors.stbh = true; }
      else if (parseNum(state.product.stbhChinh) < 100000000) { errs.push('Số tiền bảo hiểm tối thiểu 100 triệu đồng.'); fieldErrors.stbh = true; }
      else if (parseNum(state.product.stbhChinh) > 1400000000) { errs.push('Số tiền bảo hiểm không vượt quá 1 tỉ 400 triệu đồng.'); fieldErrors.stbh = true; }

      if (!parseNum(state.product.phiCoBan)) { errs.push('Vui lòng nhập Phí bảo hiểm cơ bản.'); fieldErrors.phicoban = true; }
      else if (parseNum(state.product.phiCoBan) < 6000000) { errs.push('Phí bảo hiểm cơ bản tối thiểu 6 triệu đồng.'); fieldErrors.phicoban = true; }
      else if (parseNum(state.product.phiCoBan) > 1400000000) { errs.push('Phí bảo hiểm cơ bản không vượt quá 1 tỉ 400 triệu đồng.'); fieldErrors.phicoban = true; }

      if (state.product.paymentYears < 4) { errs.push('Thời hạn đóng phí dự kiến tối thiểu 4 năm.'); fieldErrors.payyears = true; }

      if (term !== null && state.product.paymentYears > term) { errs.push('Thời hạn đóng phí không được dài hơn Thời hạn hợp đồng.'); fieldErrors.payyears = true; }

      if (state.customer.age !== null && (state.customer.age < 0 || state.customer.age > 85)) { errs.push('Tuổi được bảo hiểm ngoài phạm vi hỗ trợ (0–85 tuổi).'); fieldErrors.dob = true; }

      // Highlight / clear border đỏ cho từng input
      const toggle = (id, hasError) => {
        const el = document.getElementById(id);
        if (el) el.classList.toggle('input-error', hasError);
      };
      toggle('f-dob', fieldErrors.dob);
      toggle('f-stbh', fieldErrors.stbh);
      toggle('f-phicoban', fieldErrors.phicoban);
      toggle('f-payyears', fieldErrors.payyears);

      const banner = document.getElementById('form-errors');
      if (errs.length) {
        banner.innerHTML = errs.map(e => '• ' + e).join('<br>');
        banner.style.display = 'block';
        banner.scrollIntoView({ behavior: 'smooth', block: 'center' });
        return false;
      }
      banner.style.display = 'none';
      return true;
    }

    // ============ COMPUTE ============
    function computeResults() {
      const riders = [];
      Object.keys(state.riders).forEach(type => {
        const r = state.riders[type];
        if (!r.enabled) return;
        if (type === 'R26') { riders.push({ type, tier: r.tier }); }
        else { riders.push({ type, stbh: parseNum(r.stbh) }); }
      });
      const inputs = {
        gender: state.customer.gender,
        initialAge: state.customer.age,
        nhomNgheNghiep: state.customer.nhomNgheNghiep,
        stbhChinh: parseNum(state.product.stbhChinh),
        phiCoBan: parseNum(state.product.phiCoBan),
        phiDongThem: parseNum(state.product.phiDongThem),
        term: resolvedTerm(),
        paymentYears: state.product.paymentYears,
        startDate: todayISO(),
        riders
      };
      state.results = {
        '476': runEngine(inputs, '476'),
        '425': runEngine(inputs, '425'),
        'min': runEngine(inputs, 'min')
      };
      state.lastInputs = inputs;
    }


    // ============ RENDER: PAGE 2 ============
    const RATE_OPTIONS = [
      { key: '476', label: '4,76%/năm' },
      { key: '425', label: '4,25%/năm' },
      { key: 'min', label: 'LS cam kết' }
    ];

    function renderPage2() {
      const root = document.getElementById('page-root');
      const data = state.results[state.rateMode];
      if (state.tableMode === undefined) state.tableMode = 'spc';
      root.innerHTML = `
  <div class="card">
    <div class="summary-head">
      <div>
        <h2 class="card-title" style="margin-bottom:2px">Bảng minh họa</h2>
        <div class="hint">${state.customer.name || 'Khách hàng'} · ${state.customer.gender === 'Nam' ? 'Nam' : 'Nữ'} · ${state.customer.age} tuổi · STBH ${fmtMoney(state.lastInputs.stbhChinh)} đ</div>
      </div>
      <div class="rate-toggle">
        ${RATE_OPTIONS.map(o => `<button class="rate-btn ${state.rateMode === o.key ? 'active' : ''}" data-rate="${o.key}">${o.label}</button>`).join('')}
      </div>
    </div>

    <div class="view-toggle">
      <button class="view-btn ${state.tableMode === 'spc' ? 'active' : ''}" data-table="spc">Sản phẩm chính</button>
      <button class="view-btn ${state.tableMode === 'tong' ? 'active' : ''}" data-table="tong">Tổng sản phẩm</button>
    </div>

    ${state.tableMode === 'spc' ? renderTableSPC(data) : renderTableTong(data)}
    <div class="hint">Đơn vị: Nghìn đồng. Công cụ tham khảo nội bộ, tài liệu minh họa chính thức do Bảo Việt Nhân thọ phát hành.</div>
  </div>
  <div class="actions">
    <button class="btn btn-secondary" id="btn-back-1">← Quay lại thông tin</button>
    <button class="btn btn-primary" id="btn-go-page3">Xem tóm tắt quyền lợi →</button>
  </div>
  `;
      bindPage2Events();
    }

    function renderTableSPC(data) {
      return `
  <div class="table-wrap">
    <table class="illus-table">
      <thead><tr>
        <th class="sticky">Năm HĐ / Tuổi</th>
        <th>Tổng phí BH lũy kế</th>

          <td class="sticky">${y.year} / Tuổi ${y.age}</td>

          <td>${fmtMoneyTh(y.GTTKHD)}</td>
        </tr>`).join('')}

        <th>Phí SPBK hàng năm</th>

      </tr></thead>

        ${data.map(y => `<tr class="${y.year % 5 === 0 ? 'milestone-row' : ''}">

      </tbody>

    function bindPage2Events() {
      document.querySelectorAll('.view-btn').forEach(b => {
        b.addEventListener('click', () => { state.tableMode = b.dataset.table; renderPage2(); });
      });
      document.querySelectorAll('.rate-btn').forEach(b => {
        b.addEventListener('click', () => { state.rateMode = b.dataset.rate; renderPage2(); });
      });
      document.getElementById('btn-back-1').addEventListener('click', () => { state.page = 1; renderAll(); });
      document.getElementById('btn-go-page3').addEventListener('click', () => { state.page = 3; renderAll(); });
    }

    // ============ R26 BENEFIT TABLE (theo sheet R26) ============
    const R26_TIER_IDX = { bac: 0, vang: 1, bachkim: 2, kimcuong: 3, lucbao: 4 };
    function r26BenefitRows(tier) {
      const i = R26_TIER_IDX[tier];
      const pick = arr => arr[i];
      return [
        { label: 'Giới hạn bảo hiểm tối đa Quyền lợi Điều trị Nội trú', text: pick(['150 triệu/năm', '250 triệu/năm', '500 triệu/năm', '1 tỷ/năm', '2 tỷ/năm']), isBold: true },
        { label: 'Điều trị nội trú có phẫu thuật', note: 'Mỗi đợt điều trị', text: pick(['60 triệu', '120 triệu', '250 triệu', '400 triệu', '800 triệu']), isBold: true},
        { label: 'Điều trị nội trú không phẫu thuật', note: 'Mỗi đợt điều trị', text: pick(['30 triệu', '60 triệu', '125 triệu', '200 triệu', '400 triệu']), isBold: true },
        { label: 'Chi phí Phòng và Giường', note: 'Tối đa 60 ngày/năm', text: pick(['750 nghìn/ngày', '1,25 triệu/ngày', '2,5 triệu/ngày', '5 triệu/ngày', '10 triệu/ngày']), isBold: true },
        { label: 'Chi phí Phòng và Giường tại Khoa Hồi sức tích cực (ICU)', note: 'Tối đa 30 ngày/năm', text: 'Chi phí y tế thực tế', isBold: true },
        { label: 'Chi phí Phẫu thuật', text: 'Chi phí y tế thực tế', isBold: true },
        { label: 'Điều trị ung thư, cấy ghép nội tạng', text: 'Chi phí y tế thực tế', isBold: true },
        { label: 'Chi phí điều trị trước/sau nhập viện, chi phí y tế nội trú khác', text: 'Chi phí y tế thực tế', isBold: true },
        { label: 'Chi phí Giường dành cho người chăm sóc', note: 'Áp dụng khi NĐBH dưới 18 tuổi, tối đa 30 ngày/năm', text: pick(['300 nghìn/ngày', '500 nghìn/ngày', '700 nghìn/ngày', '1 triệu/ngày', '2 triệu/ngày']), isBold: true },
        { label: 'Chi phí điều trị nội trú tổn thương răng do tai nạn', note: 'Mỗi năm', text: pick(['1,5 triệu', '2 triệu', '4 triệu', '6 triệu', '8 triệu']), isBold: true },
        { label: 'Chi phí chạy thận nhân tạo định kỳ trong ngày', note: 'Mỗi năm', text: pick(['3 triệu', '7 triệu', '12 triệu', '15 triệu', '30 triệu']), isBold: true },
        { label: 'Chi phí vận chuyển cấp cứu trong ngày', note: 'Mỗi năm', text: pick(['1,5 triệu', '2 triệu', '4 triệu', '6 triệu', '8 triệu']), isBold: true },
        { label: 'Chi phí điều trị trong ngày', note: 'Cấp cứu, nha khoa do tai nạn; sốt xuất huyết, cúm, viêm phổi, viêm phế quản', text: pick(['4 triệu', '6 triệu', '12 triệu', '20 triệu', '30 triệu']), isBold: true },
        { label: 'Chi phí phẫu thuật trong ngày', text: pick(['15 triệu/ngày', '30 triệu/ngày', '60 triệu/ngày', '100 triệu/ngày', '200 triệu/ngày']), isBold: true }
      ];
    }

    // ============ BUILD BENEFIT SECTIONS (theo sheet 4.QUYỀN LỢI) ============
    function buildBenefitSections() {
      const inputs = state.lastInputs;
      const stbhChinh = inputs.stbhChinh;
      const byType = {};
      inputs.riders.forEach(r => byType[r.type] = r);
      const stbhR23 = byType.R23 ? byType.R23.stbh : 0;
      const sections = [];

      if (byType.R26) {
        const tierLabel = R26_TIERS.find(t => t.key === byType.R26.tier).label;
        sections.push({ title: `CHĂM SÓC SỨC KHỎE TOÀN DIỆN (R26) — Chương trình ${tierLabel}`, rows: r26BenefitRows(byType.R26.tier) });
      }
      if (byType.R29) {
        const s = byType.R29.stbh;
        sections.push({
          title: 'TRỢ CẤP VIỆN PHÍ (R29)', rows: [
            { label: 'Nằm viện cơ bản', note: 'Tối đa 3 lần/năm, 50 ngày/năm', value: s, isBold: true },
            { label: 'Nằm viện đặc biệt (ICU)', note: 'Tối đa 30 ngày/năm, 300 ngày toàn hợp đồng', value: s * 2, isBold: true },
            { label: 'Phẫu thuật cơ bản', note: 'Tối đa 2 lần/năm, 10 lần toàn hợp đồng', value: s * 5, isBold: true },
            { label: 'Phẫu thuật đặc biệt', value: s * 10, isBold: true },
            { label: 'Vận chuyển cấp cứu', note: 'Tối đa 1 triệu đồng/lần, 2 lần/năm', value: Math.min(s * 2, 1000000), isBold: true }
          ]
        });
      }
      if (byType.R21) {
        const s = byType.R21.stbh;
        sections.push({
          title: 'BỆNH NAN Y (R21)', rows: [
            { label: 'Ung thư giai đoạn đầu', value: s / 4, isBold: true },
            { label: 'Ung thư giai đoạn cuối / Đột quỵ / Nhồi máu cơ tim', note: 'Trừ đi quyền lợi giai đoạn đầu đã trả (nếu có)', value: s, isBold: true }
          ]
        });
      }
      if (byType.R25) {
        const s = byType.R25.stbh;
        sections.push({
          title: 'BỆNH LÝ NGHIÊM TRỌNG (R25)', rows: [
            { label: '38 Bệnh lý nghiêm trọng giai đoạn đầu', value: s / 4, isBold: true },
            { label: '62 Bệnh lý nghiêm trọng giai đoạn cuối', note: 'Trừ đi quyền lợi giai đoạn đầu đã trả (nếu có)', value: s, isBold: true },
            { label: '05 Bệnh lý nghiêm trọng giai đoạn cuối theo giới tính', note: 'Ung thư tiền liệt tuyến, tinh hoàn, vú, cổ tử cung, buồng trứng', value: 1.25 * s, isBold: true }
          ]
        });
      }
      if (byType.R22) {
        sections.push({
          title: 'THƯƠNG TẬT BỘ PHẬN VĨNH VIỄN DO TAI NẠN (R22)', rows: [
            { label: 'Mất từ 1 đốt ngón tay, 1 đốt ngón chân, 1 mắt, 1 tai, mất tiếng nói...', value: byType.R22.stbh }
          ]
        });
      }
      if (byType.R23) {
        sections.push({
          title: 'THƯƠNG TẬT NGHIÊM TRỌNG DO TAI NẠN (R23)', rows: [
            { label: 'Mất chức năng không thể phục hồi của 2/6 bộ phận (mắt, chân, tay), bỏng nặng, hôn mê sâu, mất khả năng sống độc lập', value: byType.R23.stbh }
          ]
        });
      }

      sections.push({
        title: 'TỬ VONG', rows: [
          { label: 'Không do tai nạn', value: stbhChinh, isBold: true },
          { label: 'Tai nạn thông thường', note: 'Điện giật, đuối nước, tai nạn giao thông/lao động/sinh hoạt...', value: stbhChinh + stbhR23, isBold: true },
          { label: 'Tai nạn máy bay', value: stbhChinh + 2 * stbhR23, isBold: true }
        ]
      });

      const r476 = state.results['476'];
      const gttkRows = [];
      [10, 15, 20].forEach(y => {
        if (r476.length >= y) gttkRows.push({ label: `Tại năm hợp đồng số ${y}`, value: r476[y - 1].GTTKHD, isBold: true });
      });
      if (gttkRows.length) {
        sections.push({ title: 'GIÁ TRỊ TÀI KHOẢN HỢP ĐỒNG', note: 'Lãi suất minh họa 4,76%/năm', rows: gttkRows });
      }
      return sections;
    }

    function renderBenefitSection(sec) {
      return `
  <div class="benefit-section">
    <div class="benefit-section-title">${sec.title}${sec.note ? `<span class="note" style="display:block;font-weight:400;margin-top:2px">${sec.note}</span>` : ''}</div>
    <table class="benefit-table"><tbody>
      ${sec.rows.map(r => `<tr>
        <td class="${r.isBold ? 'label-bold' : ''}">${r.label}${r.note ? `<span class="note">${r.note}</span>` : ''}</td>
        <td>${r.text ? r.text : fmtMoney(r.value) + ' đ'}</td>
      </tr>`).join('')}
    </tbody></table>
  </div>`;
    }

    // ============ RENDER: PAGE 3 ============
    function renderPage3() {
      const root = document.getElementById('page-root');
      const sections = buildBenefitSections();
      root.innerHTML = `
  <div class="card">
    <h2 class="card-title">Tóm tắt quyền lợi bảo hiểm</h2>
    <div class="hint" style="margin-bottom:16px">${state.customer.name || 'Khách hàng'} · ${state.customer.gender === 'Nam' ? 'Nam' : 'Nữ'} · ${state.customer.age} tuổi</div>
    ${sections.map(renderBenefitSection).join('')}
    <div class="disclaimer-box">
      Công cụ tham khảo nội bộ, tài liệu minh họa chính thức do Bảo Việt Nhân thọ phát hành.
    </div>
  </div>
  <div class="actions">
    <button class="btn btn-secondary" id="btn-back-2">← Quay lại bảng minh họa</button>
    <button class="btn btn-primary" id="btn-restart">Tạo minh họa mới</button>
  </div>
  `;
      document.getElementById('btn-back-2').addEventListener('click', () => { state.page = 2; renderAll(); });
      const restartBtn = document.getElementById('btn-restart');
      let restartArmed = false;
      restartBtn.addEventListener('click', () => {
        if (!restartArmed) {
          restartArmed = true;
          restartBtn.textContent = 'Bấm lần nữa để xác nhận xóa';
          restartBtn.classList.add('btn-danger-armed');
          setTimeout(() => { restartArmed = false; restartBtn.textContent = 'Tạo minh họa mới'; restartBtn.classList.remove('btn-danger-armed'); }, 4000);
          return;
        }
        location.reload();
      });
    }

    // ============ MAIN RENDER DISPATCH ============
    function renderAll() {
      renderSteps();
      if (state.page === 1) renderPage1();
      else if (state.page === 2) renderPage2();
      else if (state.page === 3) renderPage3();
      window.scrollTo(0, 0);
    }

    document.addEventListener('DOMContentLoaded', () => {
      try {
        initGate();
        renderAll();
      } catch (e) {
        document.body.innerHTML = '<div style="padding:24px;font-family:"Segoe UI", -apple-system, BlinkMacSystemFont, Roboto, Arial, sans-serif;color:#B5562D">Đã xảy ra lỗi khi tải công cụ: ' + e.message + '<br><br>Vui lòng thử mở lại bằng Chrome/Safari, hoặc liên hệ quản trị viên.</div>';
        console.error(e);
      }
    });

  </script>
</body>

</html>
