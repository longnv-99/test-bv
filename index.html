<!DOCTYPE html>
<html lang="vi">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  
  <title>Công cụ minh họa An Thịnh Phúc Niên</title>

  <link rel="icon" type="image/svg+xml" href="images/logo-small.png">

  <meta name="description" content="Công cụ minh họa An Thịnh Phúc Niên">
  <meta property="og:title" content="Công cụ minh họa An Thịnh Phúc Niên">
  <meta property="og:description" content="Công cụ minh họa bảo hiểm">
  <meta property="og:image" content="https://bvnt.me/images/og_image.jpg">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:url" content="https://bvnt.me">
  <meta property="og:type" content="website">

  <style>
    :root {
      --navy: #102A43;
      --navy-2: #1C3A5E;
      --navy-3: #196BB4;
      --navy-4: #003b7a;
      --gold: #B8862B;
      --gold-2: #D7A94D;
      --gold-3: #dda307;
      --gold-4: #f6b508;
      --parchment: #FAF6EE;
      --paper: #FFFFFF;
      --ink: #1B2733;
      --slate: #5C6B7A;
      --line: #E4DCC8;
      --teal: #2F6F62;
      --terracotta: #B5562D;
      --radius: 10px;
      --shadow: 0 1px 2px rgba(16, 42, 67, .06), 0 4px 16px rgba(16, 42, 67, .06);
    }

    * {
      box-sizing: border-box;
    }

    /* select {
      -webkit-appearance: none;
      appearance: none;
    } */

    body {
      margin: 0;
      background: var(--parchment);
      color: var(--ink);
      font-family: "Segoe UI", -apple-system, BlinkMacSystemFont, Roboto, Arial, sans-serif;;
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
    }

    select {
      -webkit-appearance: none;
      -moz-appearance: none;
      appearance: none;
    }

    h1,
    h2,
    h3 {
      /* font-family: "Georgia", "Times New Roman", serif; */
      font-weight: 700;
      margin: 0;
      line-height: 1.15;
      font-size: 1.08rem;
    }

    /* GATE */
    #gate {
      position: fixed;
      inset: 0;
      /* background: var(--navy); */
      display: flex;
      align-items: center;
      justify-content: flex-start;
      z-index: 999;
      background: url('images/background_pc.jpg') center center / cover no-repeat;
    }

    .gate-box {
      background: rgba(255, 255, 255, 0.08);
      border-radius: 16px;
      padding: 72px 32px;
      max-width: 460px;
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.15);
      text-align: center;
      margin-left: 10%;
      box-shadow: 0 8px 32px rgba(100, 180, 230, 1);
    }

    @media (max-width: 768px) {
    #gate {
      background: url('images/background_sp3.jpg') center center / cover no-repeat;
      justify-content: center;
    }

    .gate-box {
      width: 85%;
      margin-left: 0;
      padding: 30px 32px;
    }
  }

    .gate-box h1 {
      font-size: 25px;
      color: white;
      margin-bottom: 6px;
    }

    .gate-box p {
      color: white;
      font-size: 16px;
      margin: 0 0 20px;
    }

    .gate-box input {
      width: 100%;
      padding: 12px 14px;
      border: 1px solid var(--line);
      border-radius: 8px;
      font-size: 16px;
      text-align: center;
      letter-spacing: 1px;
      margin-bottom: 12px;
    }

    .gate-box button {
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: 8px;
      background: var(--gold-3);
      color: #fff;
      font-weight: 600;
      font-size: 15px;
      cursor: pointer;
    }

    .gate-box button:hover {
      background: var(--gold-2);
    }

    .gate-error {
      display: none;
      color: var(--terracotta);
      font-size: 13px;
      margin-top: 8px;
    }

    /* HEADER */
    .app-header {
      background: var(--navy-3);
      color: #fff;
      padding: 14px 16px 12px;
    }

    .app-banner {
      max-width: 1040px;
      margin: auto;
      padding: 0;
    }

    @media screen and (min-width: 640px) {
      .app-banner {
        padding: 0 20px;
      }
    }

    .app-banner img {
      height: 100%;
      width: 100%;
      left: 0;
      top: 0;
      right: 0;
      bottom: 0;
      color: transparent;
      object-position: center;
      object-fit: cover;
      max-width: 100%;
      display: block;
    }

    .app-header .brand {
      display: flex;
      align-items: baseline;
      gap: 10px;
      max-width: 1040px;
      margin: 0 auto;
      flex-wrap: wrap;
    }

    .app-header .brand h1 {
      font-size: 19px;
      color: #fff;
    }

    .app-header .brand .tag {
      font-size: 12px;
      color: var(--gold-4);
      letter-spacing: .04em;
      font-weight: 800;
    }

    /* STEPS */
    #steps {
      display: flex;
      align-items: center;
      max-width: 1040px;
      margin: 20px auto 0;
      padding: 0 20px;
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
      scrollbar-width: none;
      justify-content: center;
    }

    #steps::-webkit-scrollbar {
      display: none;
    }

    .step {
      display: flex;
      align-items: center;
      gap: 8px;
      cursor: pointer;
      opacity: .25;
      flex-shrink: 0;

      justify-content: center;
    }

    .step.active,
    .step.done {
      opacity: 1;
    }

    .step-num {
      width: 22px;
      height: 22px;
      min-width: 22px;
      border-radius: 50%;
      background: rgba(255, 255, 255, .15);
      /* color: #fff; */
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 15px;
      font-weight: 600;
      color: var(--navy-4);
      border: solid 1px var(--navy-4);
      /* border-color: var(--navy-4); */
    }

    .step.active > .step-num {
      border: none;
      color: #fff;
    }

    .step.active .step-num {
      background: var(--gold-3);
    }

    .step.done .step-num {
      background: var(--teal);
      border: none;
      background-color: var(--navy-4);
      color: #fff;
    }

    .step-label {
      font-size: 15px;
      /* color: #fff; */
      white-space: nowrap;
      font-weight: 700;

      color: var(--navy-4);
    }

    .step-divider {
      flex: 0 0 28px;
      height: 1px;
      /* background: rgba(255, 255, 255, .2); */
      margin: 0 10px;
      background-color: var(--navy-4);
      opacity: .15;
    }

    @media (max-width:540px) {
      .app-header {
        padding: 12px 14px 10px;
      }

      .app-header .brand h1 {
        font-size: 16px;
      }

      .app-header .brand .tag {
        font-size: 10px;
      }

      #steps {
        padding: 0 14px;
        justify-content: center;
        
      }

      .step-divider {
        flex: 0 0 16px;
        margin: 0 6px;
      }

      .step:not(.active) .step-label {
        display: none;
      }

      .step.active .step-label {
        font-size: 14px;
        font-weight: 600;
      }
    }

    /* LAYOUT */
    #page-root {
      max-width: 1040px;
      margin: 20px auto 80px;
      padding: 0 20px;
    }

    .card {
      background: var(--paper);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      padding: 22px 24px;
      margin-bottom: 18px;
      box-shadow: var(--shadow);
    }

    .card-title {
      font-size: 18px;
      color: var(--navy-4);
      margin-bottom: 16px;
      border-bottom: 2px solid var(--gold);
      padding-bottom: 10px;
    }

    .sub-title {
      font-size: 15px;
      color: var(--navy);
      margin: 18px 0 10px;
    }

    .grid2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px 20px;
    }

    @media (max-width:640px) {
      .grid2 {
        grid-template-columns: 1fr;
      }
    }

    .field label {
      display: inline-flex;
      align-items: center;
      font-size: 16px;
      color: var(--navy-4);
      margin-bottom: 6px;
      font-weight: 700;
    }

    .field input,
    .field select {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid var(--line);
      border-radius: 8px;
      font-size: 16px;
      background: #fff;
      font-variant-numeric: tabular-nums;
    }

    .field input:focus,
    .field select:focus {
      outline: 2px solid var(--gold-2);
      border-color: var(--gold);
    }

    .rider-info-icon {
      cursor: pointer;
      width: 18px;
      height: 18px;
      vertical-align: middle;
      display: inline;
      margin-left: 3px;
    }

    .hint {
      font-size: 12px;
      color: var(--slate);
      margin-top: 5px;
    }

    .hint-pending {
      color: #A65D2E;
      font-weight: 600;
    }

    .inline-row {
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }

    .inline-row .input-with-icon input {
      padding-left: 40px;
    }

    .field .input-with-icon input {
      padding-left: 40px;
    }

    .field .input-with-icon {
      position: relative;
      flex: 1;
    }

    .rider-input-row .input-with-icon {
      position: relative;
      flex: 1;
    }

    .rider-input-row .input-with-icon input {
      padding-left: 40px;
    }

    .input-with-icon .input-icon {
      position: absolute;
      left: 12px;
      top: 50%;
      transform: translateY(-50%);
      width: 18px;
      height: 18px;
      pointer-events: none;
    }

    .inline-row label {
      margin-bottom: 0;
      flex: 0 0 auto;
      white-space: nowrap;
    }

    .inline-row input {
      flex: 1;
      min-width: 140px;
    }

    .inline-row select {
      flex: 1;
      width: auto;
      min-width: 120px;
    }

    .field .inline-row .select-with-icon {
      position: relative;
      flex: 1;
    }

    .rider-input-row .select-with-icon {
      position: relative;
      flex: 1;
    }

    .field .inline-row .select-with-icon select {
      padding-left: 40px;
    }

    .rider-input-row .select-with-icon select {
      padding-left: 40px;
    }

    .select-with-icon .select-icon {
      position: absolute;
      left: 12px;
      top: 50%;
      transform: translateY(-50%);

      width: 18px;
      height: 18px;

      pointer-events: none;
      z-index: 1;
    }

    .inline-row .seg {
      flex: 1;
      min-width: 160px;
    }

    .dual-inline-row {
      display: flex;
      gap: 14px;
      flex-wrap: wrap;
    }

    .dual-inline-row .inline-row {
      flex: 1;
      min-width: 150px;
    }

    .dual-inline-row .inline-row select {
      width: auto;
      min-width: 60px;
      padding: 10px 10px;
      flex: 0 1 auto;
    }

    .dob-row {
      display: flex;
      gap: 8px;
    }

    .dob-row select {
      flex: 1;
      padding: 10px 8px;
      border: 1px solid var(--line);
      border-radius: 8px;
      font-size: 16px;
      background: #fff;
    }

    .seg {
      display: flex;
      border: 1px solid var(--line);
      border-radius: 8px;
      overflow: hidden;
    }

    .seg-btn {
      flex: 1;
      padding: 10px;
      border: none;
      background: #fff;
      cursor: pointer;
      font-size: 14px;
      color: var(--ink);
      align-items: center;
      justify-content: center;
      display: flex;
    }

    .seg-btn.active {
      background: var(--navy);
      color: #fff;
    }

    .seg-btn .gender-icon {
      width: 18px;
      height: 18px;
      flex-shrink: 0;
      margin-right: 8px;
    }

    .seg-btn.active .gender-icon {
      filter: brightness(0) invert(1);
    }

    /* RIDERS */
    .riders-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .rider-row {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 10px 0;
      border-bottom: 1px solid var(--line);
      flex-wrap: wrap;
    }

    .rider-check {
      display: flex;
      align-items: center;
      gap: 10px;
      flex: 1;
      min-width: 220px;
      cursor: pointer;
      font-size: 14px;
    }

    .rider-check-label {
      color: var(--navy-4);
      font-weight: 700;
      display: block;
    }

    .rider-check input {
      width: 18px;
      height: 18px;
      border: 1px solid var(--navy-4);
      accent-color: var(--gold);
    }

    .rider-input {
      width: 220px;
      max-width: 100%;
      padding: 9px 11px;
      border: 1px solid var(--line);
      border-radius: 8px;
      font-size: 16px;
    }

    .rider-input:disabled {
      background: #F4F1E8;
      color: #aaa;
    }

    .rider-input-col {
      display: flex;
      flex-direction: column;
      gap: 3px;
    }

    .rider-input-col .hint {
      margin-top: 0;
    }

    .rider-input-row {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    .total-first-year {
      width: 100%;
      /* padding: 10px 12px; */
      border: none;
      border-radius: 8px;
      font-size: 20px;
      background: #fff;
      font-variant-numeric: tabular-nums;
      font-weight: 700;
      color: var(--gold);
    }

    .rider-fee {
      font-size: 12.5px;
      color: var(--teal);
      font-weight: 600;
      white-space: nowrap;
    }

    /* ACTIONS */
    .actions {
      display: flex;
      gap: 12px;
      justify-content: flex-end;
      flex-wrap: wrap;
    }

    .btn {
      padding: 12px 22px;
      border-radius: 30px;
      border: 1px solid transparent;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      touch-action: manipulation;
      line-height: 1;
    }

    .btn-primary {
      background: var(--gold-3);
      color: #fff;
    }

    .btn-primary:hover {
      background: var(--gold-4);
      border-color: var(--gold-3);
    }

    .btn-secondary {
      background: #fff;
      border: 1px solid var(--line);
      color: var(--navy);
    }

    .btn-secondary:hover {
      background: #F4F1E8;
    }

    .btn-blue {
      background: #175AAB;
      color: #fff;
    }

    .btn-blue:hover {
      background: #124b8f;
    }

    .btn-green {
      background: #1E8E3E;
      color: #fff;
    }

    .btn-green:hover {
      background: #17702F;
    }

    .btn-danger-armed {
      background: var(--terracotta) !important;
      color: #fff !important;
      border-color: var(--terracotta) !important;
    }

    .error-banner {
      background: #FDECE7;
      border: 1px solid var(--terracotta);
      color: #8a3a1f;
      padding: 12px 14px;
      border-radius: 8px;
      font-size: 13.5px;
      margin-bottom: 16px;
      line-height: 1.6;
    }

    .input-error {
      border-color: var(--terracotta) !important;
      outline: 1px solid #f5c4b4 !important;
      background: #fff8f6 !important;
    }

    /* PAGE 2 */
    .summary-head {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 16px;
      flex-wrap: wrap;
      margin-bottom: 16px;
    }

    .rate-toggle {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
    }

    .rate-btn {
      padding: 7px 10px;
      border: 1px solid var(--line);
      background: #fff;
      border-radius: 20px;
      font-size: 15px;
      cursor: pointer;
      color: var(--slate);
      white-space: nowrap;
      flex: 1;
    }

    .rate-btn.active {
      background: var(--navy);
      color: #fff;
      border-color: var(--navy);
    }

    .view-toggle {
      display: flex;
      gap: 8px;
      margin-bottom: 14px;
    }

    .view-btn {
      padding: 7px 14px;
      border: 1px solid var(--line);
      background: #fff;
      border-radius: 8px;
      font-size: 15px;
      cursor: pointer;
      color: var(--slate);
      font-weight: 600;
    }

    .view-btn.active {
      background: var(--gold);
      color: #fff;
      border-color: var(--gold);
    }

    .illus-cards {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .illus-card {
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 14px 16px;
      background: #FBF9F2;
    }

    .illus-card.milestone-row {
      background: #F3DFAE;
      border-color: #D9B65C;
    }

    .illus-card-head {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      margin-bottom: 8px;
      padding-bottom: 8px;
      border-bottom: 1px solid rgba(16, 42, 67, .12);
    }

    .illus-card-year {
      font-weight: 700;
      color: var(--navy);
      font-size: 15px;
    }

    .illus-card-age {
      font-size: 12.5px;
      color: var(--slate);
    }

    .illus-card-row {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      padding: 4px 0;
      font-size: 13px;
    }

    .illus-card-label {
      color: var(--slate);
    }

    .illus-card-val {
      font-weight: 600;
      color: var(--ink);
      font-variant-numeric: tabular-nums;
      text-align: right;
      white-space: nowrap;
    }

    .illus-card-val.strong {
      color: var(--navy);
      font-weight: 700;
    }

    .illus-card-val.pos {
      color: var(--teal);
    }

    .illus-card-val.neg {
      color: var(--terracotta);
    }

    .kpi-row {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 14px;
      margin-bottom: 18px;
    }

    @media (max-width:640px) {
      .kpi-row {
        grid-template-columns: 1fr;
      }
    }

    .kpi {
      background: var(--parchment);
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 14px 16px;
    }

    .kpi-label {
      font-size: 12px;
      color: var(--slate);
      margin-bottom: 4px;
    }

    .kpi-val {
      font-size: 20px;
      font-weight: 700;
      color: var(--navy);
      font-variant-numeric: tabular-nums;
    }

    .kpi-val.pos {
      color: var(--teal);
    }

    .kpi-val.neg {
      color: var(--terracotta);
    }

    .table-wrap {
      overflow-x: auto;
      border: 1px solid var(--line);
      border-radius: 8px;
      max-height: 70vh;
    }

    .illus-table {
      border-collapse: collapse;
      width: 100%;
      font-size: 13px;
      white-space: normal;
      table-layout: fixed;
    }

    .illus-table th,
    .illus-table td {
      padding: 7px 6px;
      text-align: center;
      border-bottom: 1px solid var(--line);
      font-variant-numeric: tabular-nums;
      word-break: break-word;
      line-height: 1.3;
      font-size: 12px;
    }

    .illus-table thead th {
      background: var(--navy);
      color: #fff;
      text-align: center;
      font-weight: 600;
      position: sticky;
      top: 0;
      z-index: 2;
      white-space: normal;
    }

    .illus-table td.sticky {
      position: sticky;
      left: 0;
      z-index: 1;
      background: #fff;
      color: var(--ink);
      font-weight: 600;
      text-align: center;
      width: 78px;
    }

    .illus-table thead th.sticky {
      position: sticky;
      top: 0;
      left: 0;
      z-index: 3;
      background: var(--navy);
      color: #fff;
      text-align: center;
    }

    .illus-table tbody tr:nth-child(odd) {
      background: #FBF9F2;
    }

    .illus-table tbody tr:nth-child(odd) td.sticky {
      background: #FBF9F2;
    }

    .illus-table tbody tr.milestone-row {
      background: #F3DFAE;
    }

    .illus-table tbody tr.milestone-row td.sticky {
      background: #E8C77E;
      color: var(--navy);
    }

    .illus-table tbody tr.milestone-row td {
      font-weight: 600;
    }

    .pos {
      color: var(--teal);
      font-weight: 600;
    }

    .neg {
      color: var(--terracotta);
      font-weight: 600;
    }

    /* PAGE 3 */
    /* PAGE 3 — BANG QUYEN LOI */
    .benefit-section {
      margin-bottom: 22px;
    }

    .benefit-section-title {
      font-size: 15px;
      font-weight: 700;
      color: var(--navy-4);
      background: var(--parchment);
      border-left: 4px solid var(--gold);
      padding: 8px 12px;
      margin-bottom: 0;
    }

    .benefit-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 14.5px;
    }

    .benefit-table .label-bold{
      font-weight: 700;
    }

    .benefit-table td {
      padding: 9px 12px;
      border-bottom: 1px solid var(--line);
      vertical-align: top;
    }

    .benefit-table td:first-child {
      width: 62%;
      color: var(--ink);
    }

    .benefit-table td:last-child {
      text-align: right;
      font-weight: 700;
      color: var(--navy);
      white-space: nowrap;

        for (let m = 1; m <= 12; m++) {
          if (m === 1) {
            if (n > 1) age += 1;
            Jprev = Jprev + investedCoBan;
          }
          const ratio = sarRatio(age);
          const sar = Math.max(inputs.stbhChinh * ratio - Jprev, 0);
          const rate = rateAt(rateTable, age);
          const phiM = rate * sar / 1000 / 12;
          annualPhiRR += phiM;
          const fee = mgmtFeeMonthly(curDate.getFullYear());
          Jprev = (Jprev - phiM - fee) * (1 + monthlyRate);
          Jhist.push(Jprev);
          Hhist.push(phiM);
          curDate = addMonths(curDate, 1);
        }

        M = (M + investedDongThem) * (1 + annualRate);

        let newDuyTri = 0, newHoanPhi = 0;
        const eligible = inputs.paymentYears >= n;
        if (n % 5 === 0 && eligible) {
          const windowJ = Jhist.slice(Jhist.length - 60);
          const avgJ = windowJ.reduce((a, b) => a + b, 0) / windowJ.length;
          newDuyTri = duyTriRate(n) * avgJ;
          if (n === 5) {
            newHoanPhi = 0.5 * Hhist.slice(0, 60).reduce((a, b) => a + b, 0);
          } else if (n === 10) {
            newHoanPhi = 1.0 * Hhist.slice(60, 120).reduce((a, b) => a + b, 0);
          }
        }
        const effRateForBonusPool = rateMode === 'min' ? (annualRate + bonusInterestRate(n)) : annualRate;
        L = L * (1 + effRateForBonusPool) + newDuyTri;
        N = N * (1 + effRateForBonusPool) + newHoanPhi;

        const GTTKCoBanBase = Math.max(Jprev, 0);
        if (rateMode === 'min') {
          bonusAccum = bonusAccum * (1 + annualRate) + GTTKCoBanBase * bonusInterestRate(n);
        }
        const GTTKCoBan = GTTKCoBanBase + bonusAccum;
        const GTTKDongThem = L + M + N;
        const GTTKHD = GTTKCoBan + GTTKDongThem;
        const QLBHTuVong = Math.max(GTTKCoBan, inputs.stbhChinh) + GTTKDongThem;
        const phiChamDut = terminationFeeRate(n) * inputs.phiCoBan;
        const giaTriHoanLai = Math.max(GTTKHD - phiChamDut, 0);

        let riderPremiumYear = 0;
        for (const r of inputs.riders) riderPremiumYear += riderPremiumForAge(r, age, inputs.gender, inputs.nhomNgheNghiep);
        cumSPBK += riderPremiumYear;
        const premiumThisYear = paying ? (inputs.phiCoBan + inputs.phiDongThem) : 0;
        cumSPC += premiumThisYear;

        yearly.push({
          year: n, age, premiumThisYear, cumSPC,
          QLBHTuVong, thuongCombined: L + N,
          newBonusThisYear: newDuyTri + newHoanPhi,
          bonusMilestoneEligible: (n % 5 === 0 && eligible),
          GTTKCoBan, GTTKDongThem, GTTKHD, giaTriHoanLai,
          riderPremiumYear, cumSPBK,
          tongLuyKe: cumSPC + cumSPBK,
          chenhLech: GTTKHD - (cumSPC + cumSPBK)
        });
      }
      return yearly;
    }

      const arr = gender === 'Nam' ? MAXSTBH.nam : MAXSTBH.nu;

    function stbhChinhLimits(phiCoBan, age, gender) {
      if (!phiCoBan || age === null) return null;
      const min = Math.max(50000000, 5 * phiCoBan);

    function phiDongThemMaxLimit(phiCoBan) {

    function riderStbhLimits(riderType, age, phiCoBan, stbhChinh) {
      if (riderType === 'R21' || riderType === 'R22' || riderType === 'R23' || riderType === 'R25') {
        if (!stbhChinh) return null;
        return { min: 100000000, max: stbhChinh };

      if (riderType === 'R29') {
        if (!phiCoBan || age === null) return null;
        let tierMax;
        if (phiCoBan >= 100000000) tierMax = 2000000;
        else if (phiCoBan >= 50000000) tierMax = 1000000;
        else if (phiCoBan >= 30000000) tierMax = 500000;
        else if (phiCoBan >= 10000000) tierMax = 300000;
        else return { notAllowed: true };
        const ageCap = age >= 18 ? 2000000 : 300000;
        const min = phiCoBan >= 10000000 ? 100000 : null;
        if (min === null) return { notAllowed: true };
        return { min, max: Math.min(tierMax, ageCap) };
      }
      return null;
    }
    const R26_TIER_ORDER = ['KHÔNG', 'Bạc', 'Vàng', 'Bạch Kim', 'Kim Cương', 'Lục Bảo'];
    function r26TierRange(phiCoBan) {
      if (!phiCoBan) return null;
      function tierFor(threshold) {
        if (phiCoBan >= 50000000) return 'Lục Bảo';
        if (phiCoBan >= 30000000) return 'Kim Cương';
        if (phiCoBan >= 20000000) return 'Bạch Kim';
        if (phiCoBan >= 10000000) return 'Vàng';
        if (phiCoBan >= 5000000) return 'Bạc';
        return 'KHÔNG';
      }
      const minTier = phiCoBan >= 5000000 ? 'Bạc' : 'KHÔNG';
      const maxTier = tierFor();
      return { minTier, maxTier };

    function attachThousandFormatter(input) {

        input.value = raw ? Number(raw).toLocaleString('vi-VN') : '';
        const pos = Math.max(input.value.length - cursorFromEnd, 0);
        input.setSelectionRange(pos, pos);
      });
    }
    function calcAge(day, month, year, today) {
      if (!day || !month || !year) return null;
      const dob = new Date(Number(year), Number(month) - 1, Number(day));
      let age = today.getFullYear() - dob.getFullYear();
      const hadBday = (today.getMonth() > dob.getMonth()) || (today.getMonth() === dob.getMonth() && today.getDate() >= dob.getDate());
      if (!hadBday) age--;
      return age;

      if (type === 'R23' && NHOM_FACTOR_R23[nhom] === 0) extra = ' ⚠️ Nhóm nghề này không được nhận bảo hiểm R23.';
      return `STBH: <b>${fmtMoney(lim.min)}</b> – <b>${fmtMoney(lim.max)} đ</b>${extra}`;
    }

    function bindPage1Events() {
      document.getElementById('f-name').addEventListener('input', e => state.customer.name = e.target.value);

      const dobEl = document.getElementById('f-dob');
      dobEl.addEventListener('input', () => {
        let digits = dobEl.value.replace(/[^\d]/g, '').slice(0, 8);
        let formatted = digits;
        if (digits.length > 4) formatted = digits.slice(0, 2) + '/' + digits.slice(2, 4) + '/' + digits.slice(4);
        else if (digits.length > 2) formatted = digits.slice(0, 2) + '/' + digits.slice(2);
        dobEl.value = formatted;
        state.customer.dobStr = formatted;
        const m = formatted.match(/^(\d{2})\/(\d{2})\/(\d{4})$/);
        if (m) {
          const day = +m[1], month = +m[2], year = +m[3];
          const valid = month >= 1 && month <= 12 && day >= 1 && day <= daysInMonth(month, year);
          state.customer.age = valid ? calcAge(day, month, year, new Date()) : null;
        } else {
          state.customer.age = null;
        }
        const hintEl = document.getElementById('age-hint');
        if (hintEl) {
          hintEl.innerHTML = state.customer.age !== null
            ? `Tuổi được bảo hiểm: <b>${state.customer.age}</b> (ngày tham gia: ${new Date().toLocaleDateString('vi-VN')})`
            : (formatted.length === 10 ? '⚠️ Ngày sinh không hợp lệ.' : 'Nhập đầy đủ ngày/tháng/năm sinh theo định dạng dd/mm/yyyy để tính tuổi.');
        }
        refreshHints();
      });

      document.querySelectorAll('.seg-btn').forEach(b => {
        b.addEventListener('click', () => { state.customer.gender = b.dataset.g; renderPage1(); });
      });

        state.customer.nhomNgheNghiep = Number(e.target.value);
        refreshHints();
      });
      ['f-stbh', 'f-phicoban', 'f-phidongthem'].forEach(id => {
        const el = document.getElementById(id);
        attachThousandFormatter(el);
        el.addEventListener('input', () => {
          if (id === 'f-stbh') state.product.stbhChinh = el.value;
          if (id === 'f-phicoban') state.product.phiCoBan = el.value;
          if (id === 'f-phidongthem') state.product.phiDongThem = el.value;
          refreshHints();
        });
      });
      document.getElementById('f-term').addEventListener('change', e => { state.product.termMode = e.target.value; renderPage1(); });
      document.getElementById('f-payyears').addEventListener('input', e => state.product.paymentYears = Number(e.target.value));

      document.querySelectorAll('.rider-toggle').forEach(cb => {
        cb.addEventListener('change', () => {
          state.riders[cb.dataset.rider].enabled = cb.checked;
          renderPage1();
        });
      });
      document.querySelectorAll('[data-rider-stbh]').forEach(inp => {
        attachThousandFormatter(inp);
        inp.addEventListener('input', () => { state.riders[inp.dataset.riderStbh].stbh = inp.value; refreshHints(); });
      });
      document.querySelectorAll('[data-rider-tier]').forEach(sel => {
        sel.addEventListener('change', () => { state.riders[sel.dataset.riderTier].tier = sel.value; refreshHints(); });

      document.getElementById('btn-go-page2').addEventListener('click', () => {
        if (!validatePage1()) return;
        computeResults();
        state.page = 2;
        renderAll();
      });

      ['f-dob', 'f-stbh', 'f-phicoban', 'f-payyears'].forEach(id => {
        const el = document.getElementById(id);
        if (el) el.addEventListener('input', () => el.classList.remove('input-error'));
      });

      updateTotalFirstYear();

    function refreshHints() {
      const age = state.customer.age;
      const phiCoBan = parseNum(state.product.phiCoBan);
      const stbhChinh = parseNum(state.product.stbhChinh);
      const gender = state.customer.gender;

      const stbhHintEl = document.getElementById('hint-stbh-chinh');
      if (stbhHintEl) stbhHintEl.innerHTML = stbhHintHtml(stbhChinhLimits(phiCoBan, age, gender));

      const savingEl = document.getElementById('hint-daily-saving');
      if (savingEl) savingEl.innerHTML = phiCoBan ? `Tiết kiệm: <b>${fmtMoney(Math.round(phiCoBan / 365))} đồng/ngày</b>` : '';

      const pdtHintEl = document.getElementById('hint-phidongthem');
      if (pdtHintEl) {
        const limPDT = phiDongThemMaxLimit(phiCoBan);
        pdtHintEl.innerHTML = limPDT ? `Tối đa: <b>${fmtMoney(limPDT.max)} đ</b>/năm (5 lần phí cơ bản).` : '';
      }

      RIDER_DEFS.forEach(r => {
        const st = state.riders[r.type];
        if (r.type === 'R26') {
          const el = document.getElementById('hint-rider-R26');
          if (el) {
            const tr = r26TierRange(phiCoBan);
            el.innerHTML = tr ? `Hạng mức cho phép theo phí cơ bản: <b>${tr.minTier}</b> – <b>${tr.maxTier}</b>.` : 'Nhập Phí bảo hiểm cơ bản để xem hạng mức cho phép.';
          }
          const feeEl = document.getElementById('fee-rider-R26');
          if (feeEl) feeEl.innerHTML = riderFeeHtml(r, st);
          return;
        }
        const el = document.getElementById('hint-rider-' + r.type);
        if (el) {
          const lim = riderStbhLimits(r.type, age, phiCoBan, stbhChinh);
          el.innerHTML = riderHintHtml(r.type, lim);
        }
        const feeEl = document.getElementById('fee-rider-' + r.type);
        if (feeEl) feeEl.innerHTML = riderFeeHtml(r, st);
      });

      updateTotalFirstYear();
    }

    function updateTotalFirstYear() {
      const el = document.getElementById('f-total-first-year');
      if (!el) return;
      const phiCoBan = parseNum(state.product.phiCoBan) || 0;
      const phiDongThem = parseNum(state.product.phiDongThem) || 0;
      const riderTypes = ['R21', 'R22', 'R23', 'R25', 'R26', 'R29'];
      let riderTotal = 0;
      riderTypes.forEach(type => {
        const r = state.riders[type];
        if (!r || !r.enabled) return;
        const riderInput = type === 'R26' ? { type, tier: r.tier } : { type, stbh: parseNum(r.stbh) };
        riderTotal += riderPremiumForAge(riderInput, state.customer.age, state.customer.gender, state.customer.nhomNgheNghiep);
      });

      const total = phiCoBan + phiDongThem + riderTotal;
      el.textContent = total > 0 ? '₫ ' + fmtMoney(total) : '';
    }

    function validatePage1() {
      const errs = [];
      const term = resolvedTerm();
      const fieldErrors = { dob: false, stbh: false, phicoban: false, payyears: false };

      if (state.customer.age === null) { errs.push('Vui lòng chọn đầy đủ ngày sinh.'); fieldErrors.dob = true; }

      if (!parseNum(state.product.stbhChinh)) { errs.push('Vui lòng nhập Số tiền bảo hiểm.'); fieldErrors.stbh = true; }
      else if (parseNum(state.product.stbhChinh) < 100000000) { errs.push('Số tiền bảo hiểm tối thiểu 100 triệu đồng.'); fieldErrors.stbh = true; }
      else if (parseNum(state.product.stbhChinh) > 25000000000) { errs.push('Số tiền bảo hiểm không vượt quá 25 tỉ đồng.'); fieldErrors.stbh = true; }

      if (!parseNum(state.product.phiCoBan)) { errs.push('Vui lòng nhập Phí bảo hiểm cơ bản.'); fieldErrors.phicoban = true; }
      else if (parseNum(state.product.phiCoBan) < 6000000) { errs.push('Phí bảo hiểm cơ bản tối thiểu 6 triệu đồng.'); fieldErrors.phicoban = true; }
      else if (parseNum(state.product.phiCoBan) > 25000000000) { errs.push('Phí bảo hiểm cơ bản không vượt quá 25 tỉ đồng.'); fieldErrors.phicoban = true; }

      if (state.product.paymentYears < 4) { errs.push('Thời hạn đóng phí dự kiến tối thiểu 4 năm.'); fieldErrors.payyears = true; }

      if (term !== null && state.product.paymentYears > term) { errs.push('Thời hạn đóng phí không được dài hơn Thời hạn hợp đồng.'); fieldErrors.payyears = true; }

      if (state.customer.age !== null && (state.customer.age < 0 || state.customer.age > 85)) { errs.push('Tuổi được bảo hiểm ngoài phạm vi hỗ trợ (0–85 tuổi).'); fieldErrors.dob = true; }

      // Highlight / clear border đỏ cho từng input
      const toggle = (id, hasError) => {
        const el = document.getElementById(id);
        if (el) el.classList.toggle('input-error', hasError);
      };
      toggle('f-dob', fieldErrors.dob);
      toggle('f-stbh', fieldErrors.stbh);
      toggle('f-phicoban', fieldErrors.phicoban);
      toggle('f-payyears', fieldErrors.payyears);

      const banner = document.getElementById('form-errors');
      if (errs.length) {
        banner.innerHTML = errs.map(e => '• ' + e).join('<br>');
        banner.style.display = 'block';
        banner.scrollIntoView({ behavior: 'smooth', block: 'center' });
        return false;
      }
      banner.style.display = 'none';
      return true;
    }

    // ============ COMPUTE ============
    function computeResults() {
      const riders = [];
      Object.keys(state.riders).forEach(type => {
        const r = state.riders[type];
        if (!r.enabled) return;
        if (type === 'R26') { riders.push({ type, tier: r.tier }); }
        else { riders.push({ type, stbh: parseNum(r.stbh) }); }
      });
      const inputs = {
        gender: state.customer.gender,
        initialAge: state.customer.age,
        nhomNgheNghiep: state.customer.nhomNgheNghiep,
        stbhChinh: parseNum(state.product.stbhChinh),
        phiCoBan: parseNum(state.product.phiCoBan),
        phiDongThem: parseNum(state.product.phiDongThem),
        term: resolvedTerm(),
        paymentYears: state.product.paymentYears,
        startDate: todayISO(),
        riders
      };
      state.results = {
        '476': runEngine(inputs, '476'),
        '425': runEngine(inputs, '425'),
        'min': runEngine(inputs, 'min')
      };
      state.lastInputs = inputs;
    }

          { label: 'Do tai nạn thông thường', note: 'Điện giật, đuối nước, tai nạn giao thông/lao động/sinh hoạt...', value: stbhChinh + stbhR23, isBold: true },
          { label: 'Do tai nạn máy bay', value: stbhChinh + 2 * stbhR23, isBold: true }
        ]
      });

      const r476 = state.results['476'];
      const gttkRows = [];
      [10, 15, 20].forEach(y => {
        if (r476.length >= y) gttkRows.push({ label: `Tại năm hợp đồng số ${y}`, value: r476[y - 1].GTTKHD, isBold: true });
      });
      if (gttkRows.length) {
        sections.push({ title: 'GIÁ TRỊ TÀI KHOẢN HỢP ĐỒNG', note: 'Lãi suất minh họa 4,76%/năm', rows: gttkRows });
      }
      return sections;
    }

    function renderBenefitSection(sec) {
      return `
  <div class="benefit-section">
    <div class="benefit-section-title">${sec.title}${sec.note ? `<span class="note" style="display:block;font-weight:400;margin-top:2px">${sec.note}</span>` : ''}</div>
    <table class="benefit-table"><tbody>
      ${sec.rows.map(r => `<tr>
        <td class="${r.isBold ? 'label-bold' : ''}">${r.label.replace(/\n/g, '<br>')}${r.note ? `<span class="note">${r.note}</span>` : ''}</td>
        <td>${r.text ? r.text : fmtMoney(r.value) + ' đ'}</td>
      </tr>`).join('')}
    </tbody></table>
  </div>`;
    }

    function loadHeaderImage() {
      return new Promise(resolve => {
        let done = false;
        const finish = v => { if (!done) { done = true; resolve(v); } };
        const img = new Image();
        img.onload = () => finish(img);
        img.onerror = () => finish(null);
        img.src = HEADER_IMG_DATAURI;
        setTimeout(() => finish(null), 1200);
      });
    }

    function loadLogoImage() {
      return new Promise(resolve => {
        let done = false;
        const finish = v => { if (!done) { done = true; resolve(v); } };
        const img = new Image();
        img.onload = () => finish(img);
        img.onerror = () => finish(null);
        img.src = 'images/logo-small.png';
        setTimeout(() => finish(null), 1200);
      });
    }

    function expDrawRoundRect(ctx, x, y, w, h, r) {
      ctx.beginPath();
      ctx.moveTo(x + r, y);
      ctx.arcTo(x + w, y, x + w, y + h, r);
      ctx.arcTo(x + w, y + h, x, y + h, r);
      ctx.arcTo(x, y + h, x, y, r);
      ctx.arcTo(x, y, x + w, y, r);
      ctx.closePath();
    }

    function expWrapText(ctx, text, maxWidth) {
      const paragraphs = String(text).split('\n');
      const lines = [];
      paragraphs.forEach(para => {
        const words = para.split(' ');
        let cur = '';
        words.forEach(w => {
          const test = cur ? cur + ' ' + w : w;
          if (ctx.measureText(test).width > maxWidth && cur) { lines.push(cur); cur = w; }
          else cur = test;
        });
        lines.push(cur);
      });
      return lines;
    }

    function buildExportModel() {
      const inputs = state.lastInputs;
      let riderTotal = 0;
      inputs.riders.forEach(r => { riderTotal += riderPremiumForAge(r, inputs.initialAge, inputs.gender, inputs.nhomNgheNghiep); });
      const tongPhiNam1 = (inputs.phiCoBan || 0) + (inputs.phiDongThem || 0) + riderTotal;
      return {
        name: state.customer.name || 'Khách hàng',
        age: inputs.initialAge,
        gender: inputs.gender === 'Nam' ? 'Nam' : 'Nữ',
        nhom: inputs.nhomNgheNghiep,
        phiCoBan: inputs.phiCoBan,
        tongPhiNam1,
        term: inputs.term,
        paymentYears: inputs.paymentYears,
        sections: buildBenefitSections()
      };
    }

    // Vẽ toàn bộ bảng tóm tắt lên ctx bắt đầu từ y=0, trả về tổng chiều cao (logical px, chưa nhân DPR)
    // Vẽ 1 khung tiêu đề mục lớn: nền xanh dương, chữ vàng đồng — dùng chung cho mục 1 & mục 2
    function drawMainSectionBar(ctx, x, y, w, text, h) {
      ctx.fillStyle = EXP.navyDeep;
      ctx.fillRect(x, y, w, h);
      ctx.font = '700 17px "Segoe UI", Arial, sans-serif';
      ctx.fillStyle = EXP.bronze;
      ctx.textBaseline = 'middle';
      ctx.fillText(text, x + 16, y + h / 2 + 1);
      ctx.textBaseline = 'alphabetic';
      return h;
    }

    // Vẽ 1 cặp "Nhãn: Giá trị" trên cùng 1 dòng, trả về true baseline width dùng nếu cần
    function drawLabelValueInline(ctx, x, y, label, value) {
      ctx.font = '400 12px "Segoe UI", Arial, sans-serif';
      ctx.fillStyle = EXP.slate;
      ctx.fillText(label + ':', x, y);
      const labelW = ctx.measureText(label + ': ').width;
      ctx.font = '700 13px "Segoe UI", Arial, sans-serif';
      ctx.fillStyle = EXP.navy;
      ctx.fillText(value, x + labelW + 4, y);
    }

    // ---- Khối dùng chung cho mọi loại ảnh xuất ----
    function drawHeaderBlock(ctx, W, headerImg) {
      if (headerImg) {
        const headerH = Math.round(W * (headerImg.height / headerImg.width));
        ctx.drawImage(headerImg, 0, 0, W, headerH);
        return headerH;
      }
      // fallback nếu ảnh không tải được
      ctx.fillStyle = EXP.goldBar;
      ctx.fillRect(0, 0, W, 8);
      ctx.fillStyle = EXP.white;
      ctx.fillRect(0, 8, W, 60);
      ctx.font = '700 20px "Segoe UI", Arial, sans-serif';
      ctx.fillStyle = EXP.navy;
      ctx.fillText('MINH HỌA QUYỀN LỢI', 32, 44);
      return 68;
    }

    function drawCustomerInfoBlock(ctx, PAD, CW, W, y, model, rowOverrides) {
      const bar1H = drawMainSectionBar(ctx, PAD, y, CW, '1. THÔNG TIN KHÁCH HÀNG', 34);
      y += bar1H + 10;

      const colW = CW / 2;
      const infoRows = [
        ['Họ và tên', model.name, 'Phí cơ bản/năm', fmtMoney(model.phiCoBan) + ' đ'],
        ['Tuổi NĐBH', model.age + ' tuổi', 'Tổng phí BH năm 1', fmtMoney(model.tongPhiNam1) + ' đ'],
        ['Giới tính', model.gender, 'Thời hạn hợp đồng', model.term + ' năm'],
        ['Nhóm nghề', 'Nhóm ' + model.nhom, 'Thời hạn đóng phí', model.paymentYears + ' năm']
      ];
      if (rowOverrides) {
        Object.keys(rowOverrides).forEach(idx => { infoRows[idx] = rowOverrides[idx]; });
      }
      // Đo bề rộng nhãn dài nhất mỗi cột để giá trị luôn thẳng hàng theo cột
      ctx.font = '400 15.5px "Segoe UI", Arial, sans-serif';
      const leftLabelW = Math.max(...infoRows.map(r => ctx.measureText(r[0] + ':').width));
      const rightLabelW = Math.max(...infoRows.map(r => ctx.measureText(r[2] + ':').width));
      const valueX1 = PAD + leftLabelW + 10;
      const valueX2 = PAD + colW + rightLabelW + 10;

      const rowH = 24;
      infoRows.forEach((row, i) => {
        const ry = y + i * rowH;
        ctx.font = '400 15.5px "Segoe UI", Arial, sans-serif';
        ctx.fillStyle = EXP.ink;
        ctx.fillText(row[0] + ':', PAD, ry + 17);
        ctx.fillText(row[2] + ':', PAD + colW, ry + 17);
        ctx.font = '700 16px "Segoe UI", Arial, sans-serif';
        ctx.fillStyle = EXP.navy;
        ctx.fillText(row[1], valueX1, ry + 17);
        ctx.fillText(row[3], valueX2, ry + 17);
        if (i < infoRows.length - 1) {
          ctx.strokeStyle = EXP.line;
          ctx.beginPath(); ctx.moveTo(PAD, ry + rowH); ctx.lineTo(W - PAD, ry + rowH); ctx.stroke();
        }
      });
      return y + infoRows.length * rowH + 10;
    }

    function drawFooterBlock(ctx, W, PAD, CW, y) {
      const footerText = 'Công cụ tham khảo nội bộ, tài liệu minh họa chính thức do Bảo Việt Nhân thọ phát hành.';
      ctx.font = 'italic 400 12px "Segoe UI", Arial, sans-serif';
      const footerLines = expWrapText(ctx, footerText, CW - 16);
      ctx.fillStyle = EXP.slate;
      ctx.textAlign = 'center';
      y += 3;
      footerLines.forEach((line, li) => ctx.fillText(line, W / 2, y + 12 + li * 16));
      ctx.textAlign = 'left';
      return y + footerLines.length * 16 + 10;
    }

    function paintSummary(ctx, W, model, headerImg) {
      const PAD = 32;
      const CW = W - PAD * 2;
      let y = 0;

      y = drawHeaderBlock(ctx, W, headerImg);
      y += 8;
      y = drawCustomerInfoBlock(ctx, PAD, CW, W, y, model);

      // ---- Mục 2: Tóm tắt quyền lợi bảo hiểm ----
      const bar2H = drawMainSectionBar(ctx, PAD, y, CW, '2. TÓM TẮT QUYỀN LỢI BẢO HIỂM', 34);
      y += bar2H + 8;

      model.sections.forEach(sec => {
        // Header phụ
        const secHeaderH = sec.note ? 36 : 26;
        ctx.fillStyle = EXP.sectionBg;
        ctx.fillRect(PAD, y, CW, secHeaderH);
        ctx.fillStyle = EXP.goldBar;
        ctx.fillRect(PAD, y, 3, secHeaderH);
        ctx.textBaseline = 'middle';
        ctx.font = '700 15px "Segoe UI", Arial, sans-serif';
        ctx.fillStyle = EXP.navyDeep;
        if (sec.note) {
          ctx.fillText(sec.title, PAD + 14, y + secHeaderH / 2 - 8);
          ctx.font = 'italic 400 12px "Segoe UI", Arial, sans-serif';
          ctx.fillStyle = EXP.slate;
          ctx.fillText(sec.note, PAD + 14, y + secHeaderH / 2 + 9);
        } else {
          ctx.fillText(sec.title, PAD + 14, y + secHeaderH / 2 + 1);
        }
        ctx.textBaseline = 'alphabetic';
        y += secHeaderH + 4;

        sec.rows.forEach(r => {
          const labelWeight = r.isBold ? '700' : '400';
          ctx.font = '700 15.5px "Segoe UI", Arial, sans-serif';
          const valueText = r.text ? r.text : fmtMoney(r.value) + ' đ';
          const valueWidth = ctx.measureText(valueText).width;
          const labelMaxWidth = CW - valueWidth - 24;

          ctx.font = labelWeight + ' 15.5px "Segoe UI", Arial, sans-serif';
          const labelLines = expWrapText(ctx, r.label, labelMaxWidth);

          const labelLineH = 19;
          const noteLineH = 15;
          let noteLines = [];
          let contentH = labelLines.length * labelLineH;
          if (r.note) {
            ctx.font = 'italic 400 12.5px "Segoe UI", Arial, sans-serif';
            noteLines = expWrapText(ctx, r.note, labelMaxWidth);
            contentH += 2 + noteLines.length * noteLineH;
          }

          const padV = 5;
          const rowHeight = Math.max(contentH, labelLineH) + padV * 2;

          ctx.textBaseline = 'top';
          let ty = y + (rowHeight - contentH) / 2;
          ctx.font = labelWeight + ' 15.5px "Segoe UI", Arial, sans-serif';
          ctx.fillStyle = EXP.ink;
          labelLines.forEach(line => { ctx.fillText(line, PAD + 6, ty); ty += labelLineH; });
          if (r.note) {
            ctx.font = 'italic 400 12.5px "Segoe UI", Arial, sans-serif';
            ctx.fillStyle = EXP.slate;
            ty += 2;
            noteLines.forEach(line => { ctx.fillText(line, PAD + 6, ty); ty += noteLineH; });
          }

          ctx.font = '700 15.5px "Segoe UI", Arial, sans-serif';
          ctx.fillStyle = EXP.navy;
          ctx.textAlign = 'right';
          ctx.fillText(valueText, W - PAD - 6, y + (rowHeight - labelLineH) / 2);
          ctx.textAlign = 'left';
          ctx.textBaseline = 'alphabetic';

          ctx.strokeStyle = EXP.line;
          ctx.beginPath(); ctx.moveTo(PAD, y + rowHeight); ctx.lineTo(W - PAD, y + rowHeight); ctx.stroke();
          y += rowHeight;
        });
        y += 5;
      });

      y = drawFooterBlock(ctx, W, PAD, CW, y);
      return y;
    }

    async function renderSummaryCanvas() {
      const model = buildExportModel();
      const headerImg = await loadHeaderImage();
      const W = 800;
      const DPR = 2; // độ phân giải cao cho rõ nét trên điện thoại & khi in

      // Bước 1: đo chiều cao thực tế cần thiết
      const measureCanvas = document.createElement('canvas');
      measureCanvas.width = W; measureCanvas.height = 10;
      const measureCtx = measureCanvas.getContext('2d');
      const H = Math.ceil(paintSummary(measureCtx, W, model, headerImg));

      // Bước 2: vẽ thật lên canvas đúng kích thước
      const canvas = document.createElement('canvas');
      canvas.width = W * DPR;
      canvas.height = H * DPR;
      const ctx = canvas.getContext('2d');
      ctx.scale(DPR, DPR);
      ctx.fillStyle = '#ffffff';
      ctx.fillRect(0, 0, W, H);
      paintSummary(ctx, W, model, headerImg);

      return canvas;
    }

    // ============ EXPORT: ẢNH MINH HỌA SẢN PHẨM CHÍNH (bảng năm-qua-năm) ============
    function buildIllustrationModel() {
      const inputs = state.lastInputs;
      let riderTotal = 0;
      inputs.riders.forEach(r => { riderTotal += riderPremiumForAge(r, inputs.initialAge, inputs.gender, inputs.nhomNgheNghiep); });
      const tongPhiNam1 = (inputs.phiCoBan || 0) + (inputs.phiDongThem || 0) + riderTotal;
      return {
        name: state.customer.name || 'Khách hàng',
        age: inputs.initialAge,
        gender: inputs.gender === 'Nam' ? 'Nam' : 'Nữ',
        nhom: inputs.nhomNgheNghiep,
        phiCoBan: inputs.phiCoBan,
        tongPhiNam1,
        term: inputs.term,
        paymentYears: inputs.paymentYears,
        rows: state.results['476']
      };
    }

    function paintIllustration(ctx, W, model, headerImg) {
      const PAD = 32;
      const CW = W - PAD * 2;
      let y = 0;

      y = drawHeaderBlock(ctx, W, headerImg);
      y += 8;
      y = drawCustomerInfoBlock(ctx, PAD, CW, W, y, model, {
        1: ['Tuổi NĐBH', model.age + ' tuổi', 'Lãi suất minh họa', '4,76%']
      });

      // ---- Mục 2: Minh họa sản phẩm chính ----
      const bar2H = drawMainSectionBar(ctx, PAD, y, CW, '2. MINH HỌA SẢN PHẨM CHÍNH', 34);
      y += bar2H + 10;

      // 4 cột: Năm HĐ/Tuổi | Tổng phí BH lũy kế | Thưởng duy trì & hoàn phí rủi ro | Giá trị tài khoản HĐ — độ rộng bằng nhau
      const col0W = CW / 4;
      const col1W = CW / 4;
      const col2W = CW / 4;
      const col3W = CW / 4;
      const x0 = PAD, x1 = PAD + col0W, x2 = x1 + col1W, x3 = x2 + col2W;
      const colCenters = [x0 + col0W / 2 + 6, x1 + col1W / 2, x2 + col2W / 2, x3 + col3W / 2];
      const tableTopY = y;

      // Header bảng — nền navy, chữ trắng, cỡ chữ bằng cỡ chữ giá trị mục 1 (16px)
      const headRowH = 48;
      ctx.fillStyle = EXP.navy;
      ctx.fillRect(PAD, y, CW, headRowH);
      ctx.font = '700 16px "Segoe UI", Arial, sans-serif';
      ctx.fillStyle = '#FFFFFF';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      const headLabels = ['Năm HĐ / Tuổi', 'Tổng phí BH\nlũy kế', 'Thưởng duy trì\n& hoàn phí rủi ro', 'Giá trị tài khoản\nhợp đồng'];
      headLabels.forEach((label, i) => {
        const lines = label.split('\n');
        const startY = y + headRowH / 2 - (lines.length - 1) * 9;
        lines.forEach((line, li) => ctx.fillText(line, colCenters[i], startY + li * 18));
      });
      ctx.textBaseline = 'alphabetic';
      y += headRowH;

      // Các dòng dữ liệu — mỗi năm 1 dòng, mốc 5 năm tô đậm màu vàng nhạt
      const rowH = 32;
      model.rows.forEach((r, i) => {
        const isMilestone = r.year % 5 === 0;
        ctx.fillStyle = isMilestone ? '#F3DFAE' : (i % 2 === 1 ? '#FBF9F2' : '#FFFFFF');
        ctx.fillRect(PAD, y, CW, rowH);

        ctx.font = (isMilestone ? '700 ' : '400 ') + '16px "Segoe UI", Arial, sans-serif';
        ctx.fillStyle = isMilestone ? EXP.navy : EXP.ink;
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(r.year + ' / Tuổi ' + r.age, colCenters[0], y + rowH / 2);
        ctx.fillText(fmtMoneyTh(r.cumSPC), colCenters[1], y + rowH / 2);
        ctx.fillText(r.bonusMilestoneEligible ? fmtMoneyTh(r.newBonusThisYear) : '—', colCenters[2], y + rowH / 2);
        ctx.fillText(fmtMoneyTh(r.GTTKHD), colCenters[3], y + rowH / 2);
        ctx.textBaseline = 'alphabetic';
        ctx.textAlign = 'left';

        ctx.strokeStyle = EXP.line;
        ctx.beginPath(); ctx.moveTo(PAD, y + rowH); ctx.lineTo(W - PAD, y + rowH); ctx.stroke();
        y += rowH;
      });

      // Đường phân cách dọc giữa 4 cột — giúp khoảng cách giữa các cột cân đối, rõ ràng
      ctx.strokeStyle = EXP.line;
      [x1, x2, x3].forEach(xLine => {
        ctx.beginPath(); ctx.moveTo(xLine, tableTopY); ctx.lineTo(xLine, y); ctx.stroke();
      });

      // Viền ngoài bảng
      ctx.strokeStyle = EXP.line;
      ctx.strokeRect(PAD, y - (headRowH + model.rows.length * rowH), CW, headRowH + model.rows.length * rowH);

      y += 10;
      ctx.font = 'italic 400 10.5px "Segoe UI", Arial, sans-serif';
      ctx.fillStyle = EXP.slate;
      ctx.fillText('Đơn vị: nghìn đồng.', PAD, y + 10);
      y += 24;

      y = drawFooterBlock(ctx, W, PAD, CW, y);
      return y;
    }

    async function renderIllustrationCanvas() {
      const model = buildIllustrationModel();
      const headerImg = await loadHeaderImage();
      const W = 800;
      const DPR = 2;

      const measureCanvas = document.createElement('canvas');
      measureCanvas.width = W; measureCanvas.height = 10;
      const measureCtx = measureCanvas.getContext('2d');
      const H = Math.ceil(paintIllustration(measureCtx, W, model, headerImg));

      const canvas = document.createElement('canvas');
      canvas.width = W * DPR;
      canvas.height = H * DPR;
      const ctx = canvas.getContext('2d');
      ctx.scale(DPR, DPR);
      ctx.fillStyle = '#ffffff';
      ctx.fillRect(0, 0, W, H);
      paintIllustration(ctx, W, model, headerImg);

      return canvas;
    }

    function isIOS() {
      // Phát hiện iPhone/iPad, kể cả iPad đời mới báo user-agent giống macOS
      return /iPad|iPhone|iPod/.test(navigator.userAgent) ||
        (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
    }

    function dataUrlToBlob(dataUrl) {
      const parts = dataUrl.split(',');
      const mimeMatch = parts[0].match(/:(.*?);/);
      const mime = mimeMatch ? mimeMatch[1] : 'image/png';
      const byteString = atob(parts[1]);
      const ia = new Uint8Array(byteString.length);
      for (let i = 0; i < byteString.length; i++) ia[i] = byteString.charCodeAt(i);
      return new Blob([ia], { type: mime });
    }

    // Trả về 'ios-newtab' nếu đã xử lý theo cách mở tab mới (Safari iOS),
    // 'downloaded' nếu đã tải bằng thẻ <a download> (Android/desktop).
    function downloadDataUrl(dataUrl, filename) {
      const blob = dataUrlToBlob(dataUrl);
      const blobUrl = URL.createObjectURL(blob);

      if (isIOS()) {
        // Safari trên iOS không hỗ trợ đáng tin cậy việc tải file qua thẻ <a download>,
        // kể cả với blob URL — cách ổn định nhất là mở ảnh ở tab mới để người dùng
        // tự nhấn giữ và chọn "Lưu vào Ảnh".
        window.open(blobUrl, '_blank');
        setTimeout(() => URL.revokeObjectURL(blobUrl), 15000);
        return 'ios-newtab';
      }

      const a = document.createElement('a');
      a.href = blobUrl;
      a.download = filename;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      setTimeout(() => URL.revokeObjectURL(blobUrl), 5000);
      return 'downloaded';
    }

    async function exportSummaryPNG(btn) {
      const original = btn.textContent;
      btn.disabled = true; btn.textContent = 'Đang tạo ảnh...';
      try {
        const canvas = await renderSummaryCanvas();
        const filename = `Quyền_Lợi_${(state.customer.name || 'khach_hang').replace(/\s+/g, '_')}.png`;
        const mode = downloadDataUrl(canvas.toDataURL('image/png'), filename);
        if (mode === 'ios-newtab') {
          alert('Ảnh đã mở ở tab mới. Trên iPhone/iPad, hãy nhấn giữ vào ảnh và chọn "Lưu vào Ảnh" (Save to Photos) để tải về.');
        }
      } catch (e) {
        alert('Không thể tạo ảnh: ' + e.message);
      } finally {
        btn.disabled = false; btn.textContent = original;
      }
    }

    async function exportIllustrationPNG(btn) {
      const original = btn.textContent;
      btn.disabled = true; btn.textContent = 'Đang tạo ảnh...';
      try {
        const canvas = await renderIllustrationCanvas();
        const filename = `Minh_Họa_${(state.customer.name || 'khach_hang').replace(/\s+/g, '_')}.png`;
        const mode = downloadDataUrl(canvas.toDataURL('image/png'), filename);
        if (mode === 'ios-newtab') {
          alert('Ảnh đã mở ở tab mới. Trên iPhone/iPad, hãy nhấn giữ vào ảnh và chọn "Lưu vào Ảnh" (Save to Photos) để tải về.');
        }
      } catch (e) {
        alert('Không thể tạo ảnh: ' + e.message);
      } finally {
        btn.disabled = false; btn.textContent = original;
      }
    }

    // ============ RENDER: PAGE 3 ============
    function renderPage3() {
      const root = document.getElementById('page-root');
      const sections = buildBenefitSections();
      root.innerHTML = `
  <div class="card">
    <h2 class="card-title">Tóm tắt quyền lợi bảo hiểm</h2>
    <div class="hint" style="margin-bottom:16px">${state.customer.name || 'Khách hàng'} · ${state.customer.gender === 'Nam' ? 'Nam' : 'Nữ'} · ${state.customer.age} tuổi</div>
    ${sections.map(renderBenefitSection).join('')}
    <div class="disclaimer-box">
      Công cụ tham khảo nội bộ, tài liệu minh họa chính thức do Bảo Việt Nhân thọ phát hành.
    </div>
  </div>
  <div class="actions">
    <button class="btn btn-secondary" id="btn-back-2">← Quay lại bảng minh họa</button>
    <button class="btn btn-green" id="btn-export-illustration">Tải ảnh minh họa</button>
    <button class="btn btn-blue" id="btn-export-png">Tải ảnh tóm tắt</button>
    <button class="btn btn-primary" id="btn-restart">Tạo minh họa mới</button>
  </div>
  `;
      document.getElementById('btn-export-illustration').addEventListener('click', (e) => exportIllustrationPNG(e.currentTarget));
      document.getElementById('btn-export-png').addEventListener('click', (e) => exportSummaryPNG(e.currentTarget));
      document.getElementById('btn-back-2').addEventListener('click', () => { state.page = 2; renderAll(); });
      const restartBtn = document.getElementById('btn-restart');
      let restartArmed = false;
      restartBtn.addEventListener('click', () => {
        if (!restartArmed) {
          restartArmed = true;
          restartBtn.textContent = 'Bấm lần nữa để xác nhận xóa';
          restartBtn.classList.add('btn-danger-armed');
          setTimeout(() => { restartArmed = false; restartBtn.textContent = 'Tạo minh họa mới'; restartBtn.classList.remove('btn-danger-armed'); }, 4000);
          return;
        }
        location.reload();
      });
    }

    // ============ MAIN RENDER DISPATCH ============
    function renderAll() {
      renderSteps();
      if (state.page === 1) renderPage1();
      else if (state.page === 2) renderPage2();
      else if (state.page === 3) renderPage3();
      window.scrollTo(0, 0);
    }

    document.addEventListener('DOMContentLoaded', () => {
      try {
        initGate();
        renderAll();
      } catch (e) {
        document.body.innerHTML = '<div style="padding:24px;font-family:"Segoe UI", -apple-system, BlinkMacSystemFont, Roboto, Arial, sans-serif;color:#B5562D">Đã xảy ra lỗi khi tải công cụ: ' + e.message + '<br><br>Vui lòng thử mở lại bằng Chrome/Safari, hoặc liên hệ quản trị viên.</div>';
        console.error(e);
      }
    });

  </script>
